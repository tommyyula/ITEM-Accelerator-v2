    \u003cp class=\"lead\"\u003eAI 是 ISS Biz Team 的必走之路；“散、浅、贵”作为 AI 业务探索的必经阶段特征，提示合作进入可持续经营，而非贬低已有实践或承诺单一降成本。\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"value-flow\"\u003e\n          \u003cdiv class=\"section\"\u003e\n            \u003cdiv class=\"number\"\u003e01\u003c/div\u003e\n            \u003ch2\u003e散\u003c/h2\u003e\n            \u003cp\u003e\u003cstrong\u003e业务痛点：\u003c/strong\u003e团队与地区的能力分散，流程存在断点；相似场景难以复用，知识与责任难在组织间稳定流动。\u003c/p\u003e\n            \u003cp\u003e\u003cstrong\u003e转变 / 能力方式：\u003c/strong\u003e以 Hero Cases 和共同语义串起场景、数据、模型、Agent 与 Action；由 Owner 确认哪些能力可维护、可复用并形成闭环。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"section\"\u003e\n            \u003cdiv class=\"number\"\u003e02\u003c/div\u003e\n            \u003ch2\u003e浅\u003c/h2\u003e\n            \u003cp\u003e\u003cstrong\u003e业务痛点：\u003c/strong\u003e不少实践停留在局部试验或辅助问答，组织知识与决策行动之间仍缺少稳定闭环。\u003c/p\u003e\n            \u003cp\u003e\u003cstrong\u003e转变 / 能力方式：\u003c/strong\u003e从真实任务与用户流程出发，以 user-centric 应用、Agent 编排、反馈和业务验证，把知识推进到行动。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"section\"\u003e\n            \u003cdiv class=\"number\"\u003e03\u003c/div\u003e\n            \u003ch2\u003e贵\u003c/h2\u003e\n            \u003cp\u003e\u003cstrong\u003e业务痛点：\u003c/strong\u003e重复建设、集成维护、模型算力与治理全生命周期投入叠加，真实总成本与风险难以用单一口径衡量；不只是 token。\u003c/p\u003e\n            \u003cp\u003e\u003cstrong\u003e转变 / 能力方式：\u003c/strong\u003e建立基线与证据，比较业务结果质量、采用复用、技术深度、风险和总成本，在创新速度与投入之间做更平衡的选择。\u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"metric\"\u003e\n          \u003cdiv class=\"section\"\u003e\n            \u003ch3\u003e可持续\u003c/h3\u003e\n            \u003cp\u003eOwner 负责；闭环可维护、可复用，能在业务变化中持续演进。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"section\"\u003e\n            \u003ch3\u003e可衡量\u003c/h3\u003e\n            \u003cp\u003e共同建立基线，观察业务结果、质量、采用复用与全生命周期投入。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"section\"\u003e\n            \u003ch3\u003e更平衡\u003c/h3\u003e\n            \u003cp\u003e权衡创新速度、价值、技术深度、成本与风险，不认定一味降成本。\u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"caution\"\u003e\u003cspan class=\"accent\"\u003e讨论框架：\u003c/span\u003e以上是阶段特征与合作命题，需由 ISS Biz Team 及相关业务 Owner 结合真实场景核实；本页不提供数字，也不把假设写成已有测量。\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cfooter class=\"footer\"\u003e\u003cspan\u003e\u003cstrong\u003e讨论/产出\u003c/strong\u003e 哪个断点最影响 Customer Promise？产出一张“问题—能力—证据”对应表。\u003c/span\u003e\u003cspan\u003e05 / 40\u003c/span\u003e\u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":6,"id":"p06_confirmations","chapter":0,"ref":"0.4","type":"决策工作页","minutes":7,"title":"0.4 今天必须获得的四类确认","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}.slide-container{width:1280px;min-height:720px;background:#F7F7F9;color:#4A4A4D;font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;display:flex;flex-direction:column}.frame{display:grid;grid-template-columns:240px 1040px;flex:1;min-height:720px}.rail{border-right:1px solid #D1D1D6;display:flex;flex-direction:column;padding-top:34px;padding-left:28px;padding-right:24px;gap:21px}.brand{font-size:29px;font-weight:800;letter-spacing:-1px;color:#1A1A1A}.rail-kicker{font-size:12px;letter-spacing:2px;color:#8E8E93}.chapters{display:flex;flex-direction:column;gap:20px;padding-top:25px}.chapter{font-size:17px;display:flex;gap:12px;color:#8E8E93;line-height:1.4}.chapter .no{width:22px;font-family:monospace}.chapter.active{color:#1A1A1A;font-weight:700}.chapter.active .no{color:#8BAEAE}.rail-bottom{margin-top:auto;margin-bottom:26px;font-size:13px;line-height:1.8;color:#8E8E93}.main{display:flex;flex il-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\n      \u003c/aside\u003e\n      \u003cmain class=\"main\"\u003e\n        \u003cheader class=\"top\"\u003e\u003cspan class=\"ref\"\u003eMD §1.1–1.2\u003c/span\u003e\u003cspan class=\"badge\"\u003e章节综述 · 建议 8 分钟\u003c/span\u003e\u003c/header\u003e\n        \u003cdiv class=\"heading\"\u003e\n          \u003ch1\u003e1. 让业务、知识、模型和行动连成一条链\u003c/h1\u003e\n          \u003cp class=\"lead\"\u003e架构不是产品清单，而是一条从业务问题到可审计行动、再回到业务反馈的责任链。\u003c/p\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"content\"\u003e\n          \u003cdiv class=\"spine\"\u003e\n            \u003cdiv class=\"step\"\u003e\u003cdiv class=\"tag\"\u003e01 · CONTEXT\u003c/div\u003e\u003ch3\u003e业务问题\u003c/h3\u003e\u003cp\u003eCEC、eSVC、UKM、Field Service、SSC/GPO、Global Logistics、RMC/Pass\u003c/p\u003e\u003c/div\u003e\n            \u003cdiv class=\"step\"\u003e\u003cdiv class=\"tag\"\u003e02 · MEANING\u003c/div\u003e\u003ch3\u003e统一语义\u003c/h3\u003e\u003cp\u003eOntology 定义对象、关系、规则与可执行行动\u003c/p\u003e\u003c/div\u003e\n            \u003cdiv class=\"step\"\u003e\u003cdiv class=\"tag\"\u003e03 · FACTS\u003c/div\u003e\u003ch3\u003e业务事实\u003c/h3\u003e\u003cp\u003eData Hub 接入订单、维修、库存、物流、知识与SOP\u003c/p\u003e\u003c/div\u003e\n            \u003cdiv class=\"step\"\u003e\u003cdiv class=\"tag\"\u003e04 · JUDGMENT\u003c/div\u003e\u003ch3\u003e判断能力\u003c/h3\u003e\u003cp\u003e预测、优化、诊断、小模型与大模型分工协作\u003c/p\u003e\u003c/div\u003e\n            \u003cdiv class=\"step\"\u003e\u003cdiv class=\"tag\"\u003e05 · ACTION\u003c/div\u003e\u003ch3\u003e执行边界\u003c/h3\u003e\u003cp\u003eConnector 与 Tools 连接系统，按风险分级执行\u003c/p\u003e\u003c/div\u003e\n            \u003cdiv class=\"step\"\u003e\u003cdiv class=\"tag\"\u003e06 · GOVERN\u003c/div\u003e\u003ch3\u003e持续治理\u003c/h3\u003e\u003cp\u003eFactory、Runtime、Dashboard、Marketplace 形成回流\u003c/p\u003e\u003c/div\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"three\"\u003e\n            \u003csection class=\"section\"\u003e\n              \u003cspan class=\"mini-label\"\u003e本章叙事路线\u003c/span\u003e\n              \u003cdiv class=\"role-list\"\u003e\u003cspan\u003e\u003cb\u003e先问：\u003c/b\u003e业务人员要完成什么？\u003c/span\u003e\u003cspan\u003e\u003cb\u003e再定：\u003c/b\u003e系统要知道什么、如何判断？\u003c/span\u003e\u003cspan\u003e\u003cb\u003e最后：\u003c/b\u003e谁审核、谁使用、如何衡量？\u003c/span\u003e\u003c/div\u003e\n            \u003c/section\u003e\n            \u003csection class=\"section\"\u003e\n              \u003cspan class=\"mini-label\"\u003e跨层责任\u003c/span\u003e\n              \u003cdiv class=\"role-list\"\u003e\u003cspan\u003e\u003cb\u003eISS Biz Team：\u003c/b\u003e真实场景、业务 Owner、价值验证\u003c/span\u003e\u003cspan\u003e\u003cb\u003eCOO AI Team：\u003c/b\u003e供应链预测、优化与企业技术能力\u003c/span\u003e\u003cspan\u003e\u003cb\u003eItem：\u003c/b\u003e应用、Agent 工程与产品化\u003c/span\u003e\u003c/div\u003e\n            \u003c/section\u003e\n            \u003csection class=\"section\"\u003e\n              \u003cspan class=\"mini-label\"\u003e本章产出\u003c/span\u003e\n              \u003cdiv class=\"role-list\"\u003e\u003cspan\u003e一张六层链路与边界图\u003c/span\u003e\u003cspan\u003e一份待确认的语义、模型和 Action 清单\u003c/span\u003e\u003cspan\u003e一组进入后续 Hero Cases 的验收问题\u003c/span\u003e\u003c/div\u003e\n            \u003c/section\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"callout\"\u003e\u003cspan class=\"number\"\u003e→\u003c/span\u003e\u003cp\u003e\u003cstrong\u003e讨论提示：\u003c/strong\u003e不要先争论平台归属；先把一个业务问题拆成输入、判断、行动、证据和反馈，再把能力放回对应层。以上角色边界与正式模型名称仍需工作坊确认。\u003c/p\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cfooter class=\"footer\"\u003e\u003cspan\u003e\u003cstrong\u003e讨论 / 产出\u003c/strong\u003e 哪个业务问题适合作为跨层样板？现场记录：场景、Owner、输入、行动边界、证据、下一决策门。\u003c/span\u003e\u003cspan\u003e07 / 40\u003c/span\u003e\u003c/footer\u003e\n      \u003c/main\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":8,"id":"p08_semantic_data","chapter":1,"ref n\u003e\u003cspan\u003eOntology\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e6\u003c/span\u003e\u003cspan\u003e合作计划\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e7\u003c/span\u003e\u003cspan\u003e决策收敛\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\n      \u003c/aside\u003e\n      \u003cmain class=\"main\"\u003e\n        \u003cheader class=\"top\"\u003e\u003cspan class=\"ref\"\u003eMD §1.2 第二–三层\u003c/span\u003e\u003cspan class=\"badge\"\u003e内容与讨论 · 建议 10 分钟\u003c/span\u003e\u003c/header\u003e\n        \u003cdiv class=\"heading\"\u003e\u003ch1\u003e1.2 从系统字段到统一业务上下文\u003c/h1\u003e\u003cp class=\"lead\"\u003eOntology 让对象和关系可解释；Data Hub 让事实带着来源、时间与责任进入流程。\u003c/p\u003e\u003c/div\u003e\n        \u003cdiv class=\"content\"\u003e\n          \u003cdiv class=\"two\"\u003e\n            \u003csection class=\"section\"\u003e\n              \u003cspan class=\"marker\"\u003eOntology Studio · 对象关系，不是字段清单\u003c/span\u003e\n              \u003cdiv class=\"object-grid\"\u003e\n                \u003cdiv class=\"object\"\u003e\u003cdiv class=\"kind\"\u003e主体\u003c/div\u003e\u003cb\u003eCustomer\u003c/b\u003e\u003cspan\u003e承诺对象与服务关系\u003c/span\u003e\u003c/div\u003e\n                \u003cdiv class=\"object\"\u003e\u003cdiv class=\"kind\"\u003e交易\u003c/div\u003e\u003cb\u003eOrder / Back Order\u003c/b\u003e\u003cspan\u003e需求、缺料与状态\u003c/span\u003e\u003c/div\u003e\n                \u003cdiv class=\"object\"\u003e\u003cdiv class=\"kind\"\u003e资源\u003c/div\u003e\u003cb\u003ePart / Inventory\u003c/b\u003e\u003cspan\u003e可用量与替换约束\u003c/span\u003e\u003c/div\u003e\n                \u003cdiv class=\"object\"\u003e\u003cdiv class=\"kind\"\u003e执行\u003c/div\u003e\u003cb\u003eRepair / Shipment\u003c/b\u003e\u003cspan\u003e维修节点与运输状态\u003c/span\u003e\u003c/div\u003e\n                \u003cdiv class=\"object\"\u003e\u003cdiv class=\"kind\"\u003e判断\u003c/div\u003e\u003cb\u003eETA / Priority\u003c/b\u003e\u003cspan\u003e风险、优先级与解释\u003c/span\u003e\u003c/div\u003e\n                \u003cdiv class=\"object\"\u003e\u003cdiv class=\"kind\"\u003e结果\u003c/div\u003e\u003cb\u003eService Promise / Action\u003c/b\u003e\u003cspan\u003e承诺与可执行动作\u003c/span\u003e\u003c/div\u003e\n              \u003c/div\u003e\n              \u003cp class=\"small\"\u003e关系示例：缺料影响维修与 Service Promise；库存和运输状态改变 ETA；Priority 影响替换与分配规则。具体对象范围待业务 Owner 确认。\u003c/p\u003e\n            \u003c/section\u003e\n            \u003csection class=\"section\"\u003e\n              \u003cspan class=\"marker\"\u003eData Hub · 事实需要可追溯\u003c/span\u003e\n              \u003cdiv class=\"source-list\"\u003e\n                \u003cdiv class=\"source-row\"\u003e\u003cb\u003e客户与订单\u003c/b\u003e\u003cspan\u003eCRM / Order：请求、承诺、状态\u003c/span\u003e\u003c/div\u003e\n                \u003cdiv class=\"source-row\"\u003e\u003cb\u003e执行与资源\u003c/b\u003e\u003cspan\u003e维修、Field Service、库存、物料、物流节点\u003c/span\u003e\u003c/div\u003e\n                \u003cdiv class=\"source-row\"\u003e\u003cb\u003e知识与规则\u003c/b\u003e\u003cspan\u003eUKM / EKP / EKF、SOP、PRD、历史案例\u003c/span\u003e\u003c/div\u003e\n                \u003cdiv class=\"source-row\"\u003e\u003cb\u003e上下文标记\u003c/b\u003e\u003cspan\u003e来源系统、更新时间、Owner、脱敏与权限\u003c/span\u003e\u003c/div\u003e\n              \u003c/div\u003e\n            \u003c/section\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"three-points\"\u003e\n            \u003csection class=\"section\"\u003e\u003ch3\u003e冲突如何处理\u003c/h3\u003e\u003cp\u003e同一 Order 在不同系统状态不一致时，不静默覆盖；保留来源与时间，标记冲突，交给规则或人工确认。\u003c/p\u003e\u003c/section\u003e\n            \u003csection class=\"section\"\u003e\u003ch3\u003e过期如何暴露\u003c/h3\u003e\u003cp\u003eETA、库存和知识都需要新鲜度口径。过期不是“没有数据”，而是进入判断前的风险信号。\u003c/p\u003e\u003c/section\u003e\n            \u003csection class=\"section\"\u003e\u003ch3\u003e工作坊推演\u003c/h3\u003e\u003cp\u003e选一个 BO 情境，逐项填写对象、关系、事实源、更新时间、Owner 与缺失后的替代路径；不声称已实现接入。\u003c/p\u003e\u003c/section\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"callout\"\u003e\u003cspan class=\"number\"\u003e↳\u003c/span\u003e\u003cp\u003e\u003cstrong\u003e连接下一页：\u003c/strong\u003e上下文准备好后，系统仍需回答“如何判断”。下一页把预测、优化、规则、小模型和 LLM 放进同一业务任务，而不是堆算法名称。\u003c/p\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cfooter class=\"footer\"\u003e\u003cspan\u003e\u003cstrong\u003e讨论 / 产出\u003c/strong\u003e 哪三个对象关系最先影响 Customer Promise？产出：对象—事实源—Owner—新鲜度—冲突处理表。\u003c/span\u003e\u003cspan\u003e08 / 40\u003c/span\u003e\u003c/footer\u003e\n      \u003c/main\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":9,"id":"p09_model_tasks","chapter":1,"ref":"1.2 第四层","type":"内容与讨论","minutes":9,"title":"1.2 判断能力必须分工","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cstyle\u003e\n    *{margin:0;padding:0;box-sizing:border-box}\n    .slide-container{\n      width:1280px;\n      height:720px;\n      background:#F7F7F9;\n      color:#4A4A4D;\n      font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;\n      display:flex;\n      flex-direction:column;\n    }\n    .frame{\n      display:grid;\n      grid-template-columns:220px 1fr;\n      height:100%;\n      min-height:0;\n      gap:0;\n    }\n    /* RAIL */\n    .rail{\n      border-right:1px solid #D1D1D6;\n      display:flex;\n      flex-direction:column;\n      padding-top:18px;\n      padding-left:16px;\n      padding-right:14px;\n      gap:12px;\n      min-height:0;\n    }\n    .brand{font-size:20px;font-weight:800;letter-spacing:-.5px;color:#1A1A1A}\n    .rail-kicker{font-size:11px;letter-spacing:1.5px;color:#8E8E93}\n    .chapters{display:flex;flex-direction:column;gap:10px;padding-top:12px;overflow:auto}\n    .chapter{font-size:15px;display:flex;gap:10px;color:#8E8E93;line-height:1.3 · 建议 9 分钟\u003c/span\u003e\u003c/header\u003e\u003cdiv class=\"heading\"\u003e\u003ch1\u003e1.2 判断能力必须分工\u003c/h1\u003e\u003cp class=\"lead\"\u003e同一个业务任务需要多种判断：大模型理解与解释，预测模型估计未来，优化模型在约束中求解，Ontology 负责可控边界。\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"two\"\u003e\n          \u003csection class=\"model-band\"\u003e\u003cdiv class=\"eyebrow\"\u003eA · SCENE MODELING\u003c/div\u003e\u003ch3\u003e场景建模\u003c/h3\u003e\u003cp\u003e先把业务事件、时序、网络和生命周期结构化，让后续判断有稳定上下文。\u003c/p\u003e\u003cdiv class=\"examples\"\u003e场景聚合 · 时序结构化 · 物流网络拓扑 · 产品/设备生命周期\u003c/div\u003e\u003c/section\u003e\n          \u003csection class=\"model-band\"\u003e\u003cdiv class=\"eyebrow\"\u003eB · DECISION SUPPORT\u003c/div\u003e\u003ch3\u003e决策支持\u003c/h3\u003e\u003cp\u003e输出 ETA、需求、产能或风险的预测，并给出置信与原因，供业务选择。\u003c/p\u003e\u003cdiv class=\"examples\"\u003eLe-TSFM · Router-based Hybrid Forecast · 层级预测 · 预测解释\u003c/div\u003e\u003c/section\u003e\n          \u003csection class=\"model-band\"\u003e\u003cdiv class=\"eyebrow\"\u003eC · OPTIMIZATION DECISION\u003c/div\u003e\u003ch3\u003e优化决策\u003c/h3\u003e\u003cp\u003e把库存、运输、优先级和资源等约束放入方案比较，产生可审议的取舍。\u003c/p\u003e\u003cdiv class=\"examples\"\u003eLe-OPT · 多目标优化 · 料件替换 · 路径/装箱/库存优化\u003c/div\u003e\u003c/section\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"section\"\u003e\u003cspan class=\"chip\"\u003e任务级协同，不是算法堆叠\u003c/span\u003e\u003cdiv class=\"handoff\"\u003e\u003cdiv class=\"head\"\u003e业务问题\u003c/div\u003e\u003cdiv\u003e\u003cb\u003eOntology / 规则\u003c/b\u003e\u003cbr\u003e限定对象、状态、可用动作\u003c/div\u003e\u003cdiv\u003e\u003cb\u003e预测 / 优化\u003c/b\u003e\u003cbr\u003e分别回答“会怎样 / 怎么选”\u003c/div\u003e\u003cdiv\u003e\u003cb\u003eLLM / Agent\u003c/b\u003e\u003cbr\u003e理解请求、解释方案、编排流程\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"three\"\u003e\n          \u003csection class=\"section\"\u003e\u003ch3\u003e一条 BO 判断链\u003c/h3\u003e\u003cp\u003e订单与物流事实 → ETA / 风险预测 → 替换、库存、运输方案 → Agent 用业务语言解释。\u003c/p\u003e\u003c/section\u003e\n          \u003csection class=\"section\"\u003e\u003ch3\u003e小模型放在哪里\u003c/h3\u003e\u003cp\u003e高频分类、路由或稳定任务可由小模型与规则承担；具体目标和正式模型名待确认。\u003c/p\u003e\u003c/section\u003e\n          \u003csection class=\"section\"\u003e\u003ch3\u003e模型名称的边界\u003c/h3\u003e\u003cp\u003eLe-TSFM、Router-based Hybrid Forecast、Le-OPT 等沿用原材料写法；正式英文、成熟度与可用范围需 Owner 确认。\u003c/p\u003e\u003c/section\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"callout\"\u003e\u003cspan class=\"number\"\u003e≠\u003c/span\u003e\u003cp\u003e\u003cstrong\u003e工作坊推演：\u003c/strong\u003e为一个 Customer Promise 请求标注“哪一步需要预测、哪一步需要优化、哪一步必须规则/人工确认”。没有真实数据时只讨论口径与责任，不填写准确率或 ROI。\u003c/p\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cfooter class=\"footer\"\u003e\u003cspan\u003e\u003cstrong\u003e讨论 / 产出\u003c/strong\u003e 哪些判断可自动化，哪些只提供建议？产出：任务—模型/规则—输入—解释—人工门槛—验收证据矩阵。\u003c/span\u003e\u003cspan\u003e09 / 40\u003c/span\u003e\u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":10,"id":"p10_action_boundary","chapter":1,"ref":"1.2 第五–六层","type":"内容与讨论","minutes":8,"title":"1.2 从能理解到能执行、可审计","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cstyle\u003e\n    *{margin:0;padding:0;box-sizing:border-box}\n    .slide-container{\n      width:1280px;\n      height:720px;\n      background:#F7F7F9;\n      color:#4A4A4D;\n      font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;\n      display:flex;\n      flex-direction:column;\n    }\n    .frame{\n      display:grid;\n      grid-template-columns:220px 1fr;\n      height:100%;\n    }\n    .rail{\n      border-right:1px solid #D1D1D6;\n      display:flex;\n      flex-direction:column;\n      padding-top:20px;\n      padding-left:18px;\n      padding-right:16px;\n      gap:16px;\n      min-height:0;\n    }\n    .brand{font-size:24px;font-weight:800;letter-spac 料件、位置、异常类型、照片和处理建议，确认后更新状态。\u003c/p\u003e\n            \u003cdiv class=\"tagline\"\u003e\n              \u003ch3\u003e观看检查点\u003c/h3\u003e\n              \u003cp\u003e1. 需求如何被拆成字段与业务术语？\u003cbr\u003e\n                 2. 必填、枚举、照片等校验由谁定义？\u003cbr\u003e\n                 3. WMS 写回 Action 是否先经过确认？\u003cbr\u003e\n                 4. 生成结果如何进入复用与版本治理？\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"flow\"\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e字段与校验\u003c/b\u003e\n            \u003cp\u003e订单、料件、位置、异常、照片、建议；字段 Owner 待确认。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e流程与权限\u003c/b\u003e\n            \u003cp\u003e提交、复核、状态更新；低风险与高风险写回边界待定。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e系统连接\u003c/b\u003e\n            \u003cp\u003e通过 Connector 连接 WMS 或相关系统，不虚构已上线界面。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e验收标准\u003c/b\u003e\n            \u003cp\u003e字段完整、校验可解释、Action 可追踪、业务用户能复用。\u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"section\"\u003e\n          \u003ch2\u003e价值判断\u003c/h2\u003e\n          \u003cp\u003eCitizen Business User 获得的是受标准约束的构建能力；页面生成只是中间产物，最终要落到业务语义、权限、质量检查与可复用模板。\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cfooter class=\"footer\"\u003e\n        \u003cspan\u003e\u003cstrong\u003e讨论 / 产出\u003c/strong\u003e 谁拥有字段与写回权限？产出一张字段 Owner、Action 风险、上线质量门的清单。\u003c/span\u003e\n        \u003cspan\u003e13 / 40\u003c/span\u003e\n      \u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":14,"id":"p14_case_bo","chapter":2,"ref":"2.3","type":"Demo 与讨论","minutes":15,"title":"2.3 BO / Customer Promise：重点 Hero Cases 之一","video":true,"html":"\u003c!DOCTYPE html\u003e\n\u003chtm s=\"ref\"\u003eMD §2.3\u003c/span\u003e\n        \u003cspan class=\"badge\"\u003e重点 Demo 与讨论 · 建议 15 分钟\u003c/span\u003e\n      \u003c/header\u003e\n\n      \u003cdiv class=\"heading\"\u003e\n        \u003ch1\u003e2.3 BO / Customer Promise：重点 Hero Cases 之一\u003c/h1\u003e\n        \u003cp class=\"lead\"\u003eBO 不只是查订单状态，而是回答：为什么延迟、何时完成、下一步怎么做，并让跨组织行动可解释、可审批、可回流。\u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"video-layout\"\u003e\n          \u003cdiv class=\"video-slot\" data-video-slot=\"case-2.3\"\u003e\n            \u003cdiv class=\"play\"\u003e▷\u003c/div\u003e\n            \u003cb\u003eDemo 视频 · 待接入\u003c/b\u003e\n            \u003cspan\u003e16:9 视频区 · 待接入素材\u003c/span\u003e\n          \u003c/div\u003e\n\n          \u003cdiv class=\"side\"\u003e\n            \u003ch2\u003e跨组织事实链\u003c/h2\u003e\n            \u003cp\u003e客户请求进入 CEC/eSVC；Agent 汇总订单、维修、库存、物流、UKM 与服务信息，贯通 Field Service、GPO、Global Logistics、RMC / Pass。\u003c/p\u003e\n\n            \u003cdiv class=\"tagline\"\u003e\n              \u003ch3\u003e观看检查点\u003c/h3\u003e\n              \u003cp\u003e1. 跨系统事实是否被映射到统一对象？\u003cbr\u003e\n                 2. ETA 风险是否说明依据与不确定性？\u003cbr\u003e\n                 3. 替换、库存、运输方案如何比较？\u003cbr\u003e\n                 4. 高风险 Action 是否请求人工确认并反馈结果？\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"steps\"\u003e\n          \u003cdiv\u003e\u003cb\u003e输入\u003c/b\u003e\u003cp\u003e客户询问、订单与服务上下文；真实字段范围待确认。\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cb\u003e判断\u003c/b\u003e\u003cp\u003eOntology 统一语义；预测与优化模型分别承担 ETA 和约束求解。\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cb\u003e执行\u003c/b\u003e\u003cp\u003e低风险同步可自动化；承诺变更与关键替换需要审批。\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cb\u003e证明\u003c/b\u003e\u003cp\u003e用 Customer Promise、透明度与协作衡量，不预先承诺数字。\u003c/p\u003e\u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"section\"\u003e\n          \u003ch2\u003e成熟度边界\u003c/h2\u003e\n          \u003cp\u003e视频只作为待接入区域；演示时必须标明真实可执行、模拟演示和待确认接口。BO 的 POC 结果、公开指标与业务 Owner 需在会前确认。\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cfooter class=\"footer\"\u003e\n        \u003cspan\u003e\u003cstrong\u003e讨论 / 产出\u003c/strong\u003e 谁能确认 Customer Promise 的边界？产出事实源、审批 Action 与反馈回流清单。\u003c/span\u003e\n        \u003cspan\u003e14 / 40\u003c/span\u003e\n      \u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":15,"id":"p15_bo_walkthrough","chapter":2,"ref":"2.3 推荐 Demo 场景","type":"流程推演","minutes":15,"title":"2.3 把 BO 的八步闭环逐步走通","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}.slide-container{width:1280px;min-height:720px;background:#F7F7F9;color:#4A4A4D;font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;display:flex;flex-direction:column}.frame{display:grid;grid-template-columns:240px 1040px;flex:1;min-height:720px}.rail{border-right:1px solid #D1D1D6;display:flex;flex-direction:column;padding-top:34px;padding-left:28px;padding-right:24px;gap:21px}.brand{font-size:29px;font-weight:800;letter-spacing:-1px;color:#1A1A1A}.rail-kicker{font-size:12px;letter-spacing:2px;color:#8E8E93}.chapters{display:flex;flex-direction:column;gap:20px;padding-top:25px}.chapter{font-size:17px;display:flex;gap:12px;color:#8E8E93;line-height:1.4}.chapter .no{width:22px;font-family:monospace}.chapter.active{color:#1A1A1A;font-weight:700}.chapter.active .no{color:#8BAEAE}.rail-bottom{margin-top:auto;margin-bottom:26px;font-size:13px;line-height:1.8;color:#8E8E93}.main{display:flex;flex-direction:column;padding-top:28px;padding-left:40px;padding-right:60px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid 计时间。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"stage\"\u003e\u003cspan class=\"n\"\u003e05–06\u003c/span\u003e\u003cb\u003e方案与解释\u003c/b\u003e\u003cp\u003e优化模型比较替换、库存、优先级、运输；Agent 用业务语言解释约束与推荐。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"stage\"\u003e\u003cspan class=\"n\"\u003e07–08\u003c/span\u003e\u003cb\u003e执行与回流\u003c/b\u003e\u003cp\u003e低风险动作执行，高风险动作审批；结果同步到多方并回流用于复盘。\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"trace\"\u003e\u003csection\u003e\u003ch3\u003e每阶段必须可回答\u003c/h3\u003e\u003cp\u003e\u003cspan class=\"accent\"\u003e输入：\u003c/span\u003e从哪来、是否脱敏；\u003cspan class=\"accent\"\u003e责任：\u003c/span\u003e谁审核；\u003cspan class=\"accent\"\u003e证据：\u003c/span\u003e日志、规则命中、模型版本或人工批注。\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch3\u003e工作坊示例边界\u003c/h3\u003e\u003cp\u003e流程顺序是建议推演，不代表已有生产集成；不写真实 ETA、准确率或 ROI。接口和 Action 的可执行程度待确认。\u003c/p\u003e\u003c/section\u003e\u003c/div\u003e\u003cdiv class=\"trace\"\u003e\u003csection\u003e\u003ch3\u003e跨团队回流\u003c/h3\u003e\u003cp\u003eCEC/eSVC 获得一致答复，Field Service 看到资源影响，UKM/GPO 获得知识与物料反馈，物流更新节点。\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch3\u003e下一验证门\u003c/h3\u003e\u003cp\u003e选择一条脱敏订单链，核对事实源、对象关系、预测输入、审批点和可回放证据。\u003c/p\u003e\u003c/section\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"footer\"\u003e\u003cspan\u003e\u003cstrong\u003e讨论 / 产出\u003c/strong\u003e 哪一步最容易断点？产出八步流程的输入—Owner—证据矩阵。\u003c/span\u003e\u003cspan\u003e15 / 40\u003c/span\u003e\u003c/footer\u003e\u003c/main\u003e\u003c/div\u003e\u003c/div\u003e\u003c/body\u003e\u003c/html\u003e\n"},{"n":16,"id":"p16_bo_quality","chapter":2,"ref":"2.3 指标与风险","type":"评估讨论","minutes":15,"title":"2.3 指标不是承诺；治理不是把模型锁死","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}.slide-container{width:1280px;min-height:720px;background:#F7F7F9;color:#4A4A4D;font-family:\"Noto Sans SC\",\"Microsoft \u003c/nav\u003e\u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\u003c/aside\u003e\u003cmain class=\"main\"\u003e\u003cheader class=\"top\"\u003e\u003cspan class=\"ref\"\u003eMD §2.3 指标与风险\u003c/span\u003e\u003cspan class=\"badge\"\u003e评估讨论 · 建议 15 分钟\u003c/span\u003e\u003c/header\u003e\u003cdiv class=\"heading\"\u003e\u003ch1\u003e2.3 指标不是承诺；治理不是把模型锁死\u003c/h1\u003e\u003cp class=\"lead\"\u003e先定义口径，再讨论目标；用分级自治、模型分工和可回放证据，回应准确性、规模质量与客户体验的真实约束。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"content\"\u003e\u003cdiv class=\"metrics\"\u003e\u003cdiv\u003e\u003cspan class=\"tag\"\u003e体验\u003c/span\u003e\u003cb\u003eCustomer Promise\u003c/b\u003e\u003cp\u003eETA / 承诺准确率、满意度、NPS；基线与目标待确认。\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan class=\"tag\"\u003e效率\u003c/span\u003e\u003cb\u003e流程响应\u003c/b\u003e\u003cp\u003e查询响应时间、重复来电/查询、Order Close 周期。\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan class=\"tag\"\u003e协作\u003c/span\u003e\u003cb\u003e跨团队决策\u003c/b\u003e\u003cp\u003e人工确认次数、替换建议采纳率、跨系统同步完整性。\u003c/p\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan class=\"tag\"\u003e自治\u003c/span\u003e\u003cb\u003eAction 质量\u003c/b\u003e\u003cp\u003e自动执行率、人工介入率、异常升级与回放完整度。\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"risk\"\u003e\u003csection\u003e\u003ch2\u003e四个风险问题\u003c/h2\u003e\u003cp\u003e约束是否过硬？不加约束是否失控？规模化后质量能否保持？BO 是否只变成减员项目？这些都是评估议题，不用演示话术绕开。\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e回应方式\u003c/h2\u003e\u003cp\u003e\u003cspan class=\"accent\"\u003e按风险分级自治：\u003c/span\u003e预测、优化、规则、大模型各司其职；高风险 Action 保留人工审批；沙盒、测试集、版本与日志支撑质量判断。\u003c/p\u003e\u003c/section\u003e\u003c/div\u003e\u003cdiv class=\"risk\"\u003e\u003csection\u003e\u003ch2\u003e证据卡片\u003c/h2\u003e\u003cp\u003e每个指标填写基线、目标、口径、数据源、Owner 与复核周期；当前没有数据的字段统一标“待确认”。\u003c/p\u003e\u003c/section\u003e\u003csection\u003e\u003ch2\u003e价值边界\u003c/h2\u003e\u003cp\u003e核心价值优先看 Customer Promise、透明 span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e7\u003c/span\u003e\u003cspan\u003e决策收敛\u003c/span\u003e\u003c/div\u003e\n      \u003c/nav\u003e\n      \u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\n    \u003c/aside\u003e\n\n    \u003cmain class=\"main\"\u003e\n      \u003cheader class=\"top\"\u003e\n        \u003cspan class=\"ref\"\u003eMD §2.4\u003c/span\u003e\n        \u003cspan class=\"badge\"\u003eDemo 与讨论 · 建议 15 分钟\u003c/span\u003e\n      \u003c/header\u003e\n\n      \u003cdiv\u003e\n        \u003cdiv class=\"heading\"\u003e\n          \u003ch1\u003e2.4 BNP → Dynamic Form → PEI\u003c/h1\u003e\n          \u003cp class=\"lead\"\u003e证明建模资产可以从业务对象与规则迁移到可运行表单，再扩展到复杂业务生态，而不是停留在聊天入口。\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"video-layout\"\u003e\n          \u003cdiv class=\"video-slot\" data-video-slot=\"case-2.4\"\u003e\n            \u003cdiv class=\"play\"\u003e▷\u003c/div\u003e\n            \u003cb\u003eDemo 视频 · 待接入\u003c/b\u003e\n            \u003cspan\u003e16:9 视频区 · 待接入素材\u003c/span\u003e\n          \u003c/div\u003e\n\n          \u003cdiv class=\"side\"\u003e\n            \u003ch2\u003e迁移链\u003c/h2\u003e\n            \u003cp\u003e\u003cspan class=\"accent\"\u003eBNP\u003c/span\u003e 业务对象与规则 → Ontology Studio → Agent Factory 配置能力 → ITEMGPT Runtime 表单页面 → PEI 伙伴、采购或生态流程。\u003c/p\u003e\n\n            \u003cdiv class=\"tagline\"\u003e\n              \u003ch3\u003e观看检查点\u003c/h3\u003e\n              \u003cp\u003e1. BNP 的对象、规则和边界是否先被明确？\u003cbr\u003e\n              2. Ontology 如何转成表单字段与 Action？\u003cbr\u003e\n              3. 迁移到 PEI 时，哪些共用、哪些差异化？\u003cbr\u003e\n              4. 是否呈现了治理与复用，而非只生成页面？\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"flow\"\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e建模输入\u003c/b\u003e\n            \u003cp\u003e业务对象、状态、规则；BNP 全称与范围待 Owner 补充。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e能力配置\u003c/b\u003e\n            \u003cp\u003eAgent、Ontology、Skill、Tools 组合；不假设已有成熟度。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e应用运行\u003c/b\u003e\n            \u003cp\u003eDynamic Form 承接现场任务；权限与写回边界待确认。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e生态扩展\u003c/b\u003e\n            \u003cp\u003ePEI 伙伴/采购/生态范围待确认，先做工作坊推演。\u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"section\"\u003e\n          \u003ch2\u003e证明任务\u003c/h2\u003e\n          \u003cp\u003e同一套业务理解能否在相关流程中迁移，是本例的验收核心；BNP 与 PEI 的正式全称、负责人和可演示边界不在本页猜测。\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cfooter class=\"footer\"\u003e\n        \u003cspan\u003e\u003cstrong\u003e讨论 / 产出\u003c/strong\u003e 哪些对象与 Action 应标准化？产出 BNP/PEI 的共用项、差异项与待确认 Owner。\u003c/span\u003e\n        \u003cspan\u003e17 / 40\u003c/span\u003e\n      \u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":18,"id":"p18_case_sop","chapter":2,"ref":"2.5","type":"Demo 与讨论","minutes":15,"title":"2.5 Record \u0026 Reply → CEC SOP","video":true,"html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}\n.slide-container{\n  width:1280px;\n  height:720px;\n  background:#F7F7F9;\n  color:#4A4A4D;\n  font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;\n  display:flex;\n  flex-direction:column;\n}\n.frame{\n  display:grid;\n  grid-template-columns:240px 1040px;\n  height:100%;\n}\n.rail{\n  border-right:1px solid #D1D1D6;\n  display:flex;\n  flex-direction:col apter\"\u003e\u003cspan class=\"no\"\u003e0\u003c/span\u003e\u003cspan\u003eWhy · 为什么现在\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e1\u003c/span\u003e\u003cspan\u003e总体架构\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter active\"\u003e\u003cspan class=\"no\"\u003e2\u003c/span\u003e\u003cspan\u003e七个案例\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e3\u003c/span\u003e\u003cspan\u003e能力底座\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e4\u003c/span\u003e\u003cspan\u003e业务工具\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e5\u003c/span\u003e\u003cspan\u003eOntology\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e6\u003c/span\u003e\u003cspan\u003e合作计划\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e7\u003c/span\u003e\u003cspan\u003e决策收敛\u003c/span\u003e\u003c/div\u003e\n      \u003c/nav\u003e\n      \u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\n    \u003c/aside\u003e\n\n    \u003cmain class=\"main\"\u003e\n      \u003cheader class=\"top\"\u003e\n        \u003cspan class=\"ref\"\u003eMD §2.6\u003c/span\u003e\n        \u003cspan class=\"badge\"\u003eDemo 与讨论 · 建议 10 分钟\u003c/span\u003e\n      \u003c/header\u003e\n\n      \u003cdiv class=\"heading\"\u003e\n        \u003ch1\u003e2.6 eSVC Small Model：高频判断与成本分层\u003c/h1\u003e\n        \u003cp class=\"lead\"\u003e把简单、高频、可验证的判断交给轻量模型或规则，让复杂任务再进入 LLM；本例是补充能力，不抢 BO 主线。\u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"video-layout\"\u003e\n          \u003cdiv class=\"video-slot\" data-video-slot=\"case-2.6\"\u003e\n            \u003cdiv class=\"play\"\u003e▷\u003c/div\u003e\n            \u003cb\u003eDemo 视频 · 待接入\u003c/b\u003e\n            \u003cspan\u003e16:9 视频区 · 待接入素材\u003c/span\u003e\n          \u003c/div\u003e\n\n          \u003cdiv class=\"side\"\u003e\n            \u003ch2\u003e路由路径\u003c/h2\u003e\n            \u003cp\u003e\u003cspan class=\"accent\"\u003eeSVC 入口\u003c/span\u003e → 小模型/规则分类 → 知识、Agent 或人工队列；复杂判断再调用 LLM。情绪、意图、路由中的准确目标尚待确认。\u003c/p\u003e\n\n            \u003cdiv class=\"tagline\"\u003e\n              \u003ch3\u003e观看检查点\u003c/h3\u003e\n              \u003cp\u003e1. 入口输入与分类标签是否明确？\u003cbr\u003e2. 小模型为什么能承担该判断？\u003cbr\u003e3. 不确定或低置信度如何升级？\u003cbr\u003e4. 路由结果是否记录，便于复核 Token 与质量？\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"route\"\u003e\n          \u003cdiv\u003e\u003cb\u003e待确认目标\u003c/b\u003e\u003cp\u003e情绪识别、意图识别、路由或其他能力；不替业务 Owner 猜定。\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cb\u003e轻量层\u003c/b\u003e\u003cp\u003e规则、模板与小模型处理稳定高频任务，减少不必要的上下文。\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cb\u003e复杂层\u003c/b\u003e\u003cp\u003e需要解释、跨系统协作或长上下文时再调用 LLM/Agent。\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv\u003e\u003cb\u003e验收证据\u003c/b\u003e\u003cp\u003e分类质量、升级率、Token 使用口径、人工修正回流；无生产效果承诺。\u003c/p\u003e\u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"section\"\u003e\n          \u003ch2\u003e与 BO 的关系\u003c/h2\u003e\n          \u003cp\u003eeSVC Small Model 可作为入口分层与 Model Hub 的示例；它帮助 BO 等复杂流程先过滤请求，但不替代跨组织事实、预测、优化与审批闭环。\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cfooter class=\"footer\"\u003e\n        \u003cspan\u003e\u003cstrong\u003e讨论 / 产出\u003c/strong\u003e 先确认目标还是先确认数据？产出分类标签、升级规则、质量口径与 Owner。\u003c/span\u003e\n        \u003cspan\u003e19 / 40\u003c/span\u003e\n      \u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":20,"id":"p20_ca 3e\n        \u003cp class=\"lead\"\u003e把 CEC 的请求、订单、服务、知识和 SOP 封装成可调用的 AI App；无头化是后台协作，不是取消人工。\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"video-layout\"\u003e\n          \u003cdiv class=\"video-slot\" data-video-slot=\"case-2.7\"\u003e\n            \u003cdiv class=\"play\"\u003e▷\u003c/div\u003e\n            \u003cb\u003eDemo 视频 · 待接入\u003c/b\u003e\n            \u003cspan\u003e16:9 视频区 · 待接入素材\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"side\"\u003e\n            \u003ch2\u003e坐席与后台协作\u003c/h2\u003e\n            \u003cp\u003eAgent 检索并解释信息，生成标准回复、推荐下一步；权限与审批控制执行，过程记录和人工修正回流知识体系。\u003c/p\u003e\n            \u003cdiv class=\"tagline\"\u003e\n              \u003ch3\u003e观看检查点\u003c/h3\u003e\n              \u003cp\u003e1. 坐席如何调用并补充上下文？\u003cbr\u003e2. 推荐回复是否链接知识/SOP 证据？\u003cbr\u003e3. 哪些任务能执行，哪些需要审批？\u003cbr\u003e4. 异常如何升级，人工修正如何回流？\u003c/p\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"flow\"\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e连接信息\u003c/b\u003e\n            \u003cp\u003e客户请求、订单、服务、知识与 SOP；接口范围待确认。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e服务坐席\u003c/b\u003e\n            \u003cp\u003e调用、解释、回复、推荐；Agent 支持人而非替代人。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e后台运行\u003c/b\u003e\n            \u003cp\u003e补充资料、监控状态、异常升级；日志与权限不可缺失。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv\u003e\n            \u003cb\u003e产品探索\u003c/b\u003e\n            \u003cp\u003eCSAS Genesys AI App 成熟度待确认，Genesys Marketplace 是验证后探索渠道。\u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"section\"\u003e\n          \u003ch2\u003e商业化边界\u003c/h2\u003e\n          \u003cp\u003e从 ISS 验证过的能力走向标准产品前，需确认 IP、数据与模型边界、联合销售交付、收益分配、版本与售后责任；不把渠道探索写成既成事实。\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cfooter class=\"footer\"\u003e\n        \u003cspan\u003e\u003cstrong\u003e讨论 / 产出\u003c/strong\u003e 哪些能力具备产品封装条件？产出内部验证证据、成熟度标签与外推前置决策项。\u003c/span\u003e\n        \u003cspan\u003e20 / 40\u003c/span\u003e\n      \u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":21,"id":"p21_cases_selection","chapter":2,"ref":"2 / 6.4","type":"案例组合工作页","minutes":10,"title":"2. 为首批 Hero Cases 做组合选择","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}.slide-container{width:1280px;min-height:720px;background:#F7F7F9;color:#4A4A4D;font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;display:flex;flex-direction:column}.frame{display:grid;grid-template-columns:240px 1040px;flex:1;min-height:720px}.rail{border-right:1px solid #D1D1D6;display:flex;flex-direction:column;padding-top:34px;padding-left:28px;padding-right:24px;gap:21px}.brand{font-size:29px;font-weight:800;letter-spacing:-1px;color:#1A1A1A}.rail-kicker{font-size:12px;letter-spacing:2px;color:#8E8E93}.chapters{display:flex;flex-direction:column;gap:20px;padding-top:25px}.chapter{font-size:17px;display:flex;gap:12px;color:#8E8E93;line-height:1.4}.chapter .no{width:22px;font-family:monospace}.chapter.active{color:#1A1A1A;font-weight:700}.chapter.active .no{color:#8BAEAE}.rail-bottom{margin-top:auto;margin-bottom:26px;font-size:13px;line-height:1.8;color:#8E8E93}.main{display:flex;flex-direction:column;padding-top:28px;padding-left:40px;padding-right:60px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #D1D1D6;min-height:42px;font-size:13px;letter-spacing:.5px;color:#8E8E93}.badge{display:inline-flex;align-items:center;border:1px solid #D1D1D6;border-radius:4px;padding-top:3px;padding-left:9px;padding-right:9px; ass=\"chapter\"\u003e\u003cspan class=\"no\"\u003e1\u003c/span\u003e\u003cspan\u003e总体架构\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"chapter active\"\u003e\u003cspan class=\"no\"\u003e2\u003c/span\u003e\u003cspan\u003e七个案例\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e3\u003c/span\u003e\u003cspan\u003e能力底座\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e4\u003c/span\u003e\u003cspan\u003e业务工具\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e5\u003c/span\u003e\u003cspan\u003eOntology\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e6\u003c/span\u003e\u003cspan\u003e合作计划\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e7\u003c/span\u003e\u003cspan\u003e决策收敛\u003c/span\u003e\u003c/div\u003e\u003c/nav\u003e\u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\u003c/aside\u003e\u003cmain class=\"main\"\u003e\u003cheader class=\"top\"\u003e\u003cspan class=\"ref\"\u003eMD §2 / §6.4\u003c/span\u003e\u003cspan class=\"badge\"\u003e案例组合工作页 · 建议 10 分钟\u003c/span\u003e\u003c/header\u003e\u003cdiv class=\"heading\"\u003e\u003ch1\u003e2. 为首批 Hero Cases 做组合选择\u003c/h1\u003e\u003cp class=\"lead\"\u003e七例不是七个同时承诺的项目；用价值、数据、复杂度、复用和成熟度做选择，先形成少量高价值并行验证。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"content\"\u003e\u003ctable class=\"table\"\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e候选证明任务\u003c/th\u003e\u003cth\u003e优先看什么\u003c/th\u003e\u003cth\u003e当前演示成熟度\u003c/th\u003e\u003cth\u003e组合讨论\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003cstrong\u003e港口拖柜 / WMS\u003c/strong\u003e\u003c/td\u003e\u003ctd\u003e流程执行、业务建应用\u003c/td\u003e\u003ctd\u003e可演示 / 模拟边界待核\u003c/td\u003e\u003ctd\u003e适合证明入口与执行，但接口和脱敏要先确认。\u003c/td\u003e\u003c an\u003e\u003c/header\u003e\u003cdiv class=\"heading\"\u003e\u003ch1\u003e3.1–3.3 COO AI × Item × ISS Biz Team 的 Hybrid 协同\u003c/h1\u003e\u003cp class=\"lead\"\u003eHybrid AI 不是“接一个模型”，而是把业务场景、生成式协作、预测 / 诊断 / 优化与平台技术栈放进同一条 Customer Promise 流。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"content\"\u003e\u003cdiv class=\"hybrid\"\u003e\u003csection class=\"lanes\"\u003e\u003cdiv class=\"lane\"\u003e\u003cstrong\u003e场景与架构\u003c/strong\u003e\u003cp\u003e三方结合业务数据、知识与约束，识别时序、拓扑、生命周期和流程边界；架构选择与模型范围待共同确认。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"lane\"\u003e\u003cstrong\u003e生成式协作\u003c/strong\u003e\u003cp\u003e大模型负责理解、解释、规划与多 Agent 协作，小模型、规则和知识组件承担高频、稳定或受约束的任务。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"lane\"\u003e\u003cstrong\u003e预测 / 诊断 / 优化\u003c/strong\u003e\u003cp\u003e按真实任务组合预测、诊断、优化与规则比较方案；Agent 串起审批与行动，不将某一能力归为单方独占。\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"lane\"\u003e\u003cstrong\u003e平台化运行\u003c/strong\u003e\u003cp\u003e通过企业级技术栈、Model Hub、Data Hub、权限、日志与治理能力，让可验证的能力获得复用与规模化赋能。\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"roles\"\u003e\u003cdiv class=\"role\"\u003e\u003cstrong\u003eCOO AI Team\u003c/strong\u003e\u003cspan\u003eAI 技术框架、企业级技术栈、生成式 AI、预测 / 诊断 / 优化、平台能力与规模化赋能；与各方共同定义服务化边界。\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"role\"\u003e\u003cstrong\u003eItem\u003c/strong\u003e\u003cspan\u003e把业务需求桥接为可落地应用；以 user-centric 技术理念支撑应用工程、Agent 流程、动态表单、Connector / Action 与产品化。\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"role\"\u003e\u003cstrong\u003eISS Biz Team\u003c/strong\u003e\u003cspan\u003e提供真实场景、行业知识、数据洞察、业务 Owner、用户流程与价值验证；以反馈确认成熟度和可用性。\u003c/span\u003e\u003c/div\u003e\u003c/section\u003e\u003c/div\u003e\u003cdiv class=\"quote\"\u003e\u003cspan class=\"tag\"\u003eCustomer Promise 流\u003c/span\u003e\u003cp\u003e请求与事实 → Ontology 统一语义 → Model Hub 预测 / 诊断 / 优化 → 生成式 AI 解释并建议 → 人工确认或低风险执行 → 结果回流。工作坊推演，不代表当前已全部打通。\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"footer\"\u003e\u003cspan\u00 03c/div\u003e\n      \u003cdiv class=\"rail-kicker\"\u003eBUSINESS VALUE WORKSHOP\u003c/div\u003e\n      \u003cdiv class=\"chapters\"\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e0\u003c/span\u003e\u003cspan\u003eWhy · 为什么现在\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e1\u003c/span\u003e\u003cspan\u003e总体架构\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e2\u003c/span\u003e\u003cspan\u003e七个案例\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e3\u003c/span\u003e\u003cspan\u003e能力底座\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter active\"\u003e\u003cspan class=\"no\"\u003e4\u003c/span\u003e\u003cspan\u003e业务工具\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e5\u003c/span\u003e\u003cspan\u003eOntology\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e6\u003c/span\u003e\u003cspan\u003e合作计划\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e7\u003c/span\u003e\u003cspan\u003e决策收敛\u003c/span\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\n    \u003c/aside\u003e\n    \u003cmain class=\"main\"\u003e\n      \u003cheader class=\"top\"\u003e\n        \u003cspan class=\"ref\"\u003eMD §4.1\u003c/span\u003e\n        \u003cspan class=\"badge\"\u003e操作推演与讨论 · 建议 10 分钟\u003c/span\u003e\n      \u003c/header\u003e\n      \u003cdiv class=\"heading\"\u003e\n        \u003ch1\u003e4.1 ITEMGPT Runtime：目标表达、标准化、后台执行\u003c/h1\u003e\n        \u003cp class=\"lead\"\u003eRuntime 的价值不是一个聊天入口，而是把业务目标翻译成可复用、可控、可反馈的工作流。\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"steps\"\u003e\n          \u003cdiv class=\"step\"\u003e\n            \u003cdiv class=\"number\"\u003e01 / 目标\u003c/div\u003e\n            \u003ch3\u003e用业务语言提出任务\u003c/h3\u003e\n            \u003cp\u003e例如：生成 WMS 异常表单、解释 BO 原因与 ETA、整理 CEC 记录为 SOP 草稿、提出料件替换建议。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"step\"\u003e\n            \u003cdiv class=\"number\"\u003e02 / 标准化\u003c/div\u003e\n            \u003ch3\u003e套用组织约定\u003c/h3\u003e\n            \u003cp\u003e模板、标准字段、业务术语、标准输出格式和质量检查，把个人定制变成组织可读的输入。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"step\"\u003e\n            \u003cdiv class=\"number\"\u003e03 / Action\u003c/div\u003e\n            \u003ch3\u003e按权限给出下一步\u003c/h3\u003e\n            \u003cp\u003e查询、建议与写入分层；低风险动作可自动执行，高风险动作保留业务确认，具体等级待确认。\u003c/p\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"step\"\u003e\n            \u003cdiv class=\"number\"\u003e04 / 回流\u003c/div\u003e\n            \u003ch3\u003e让后台任务持续运行\u003c/h3\u003e\n            \u003cp\u003e状态监控、资料整理、任务派发、通知、同步和异常提醒由 Robotics 机制承接，异常回到人。\u003c/p\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"two\"\u003e\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e四个入口，保持同一条标准\u003c/h2\u003e\n            \u003ctable class=\"table\"\u003e\n              \u003ctr\u003e\u003cth\u003e业务请求\u003c/th\u003e\u003cth\u003eRuntime 应追问或校验\u003c/th\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003ctd\u003eWMS 异常表单\u003c/td\u003e\u003ctd\u003e订单、料件、位置、异常、照片；确认写回 WMS 的权限与字段。\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003ctd\u003eBO 原因与 ETA\u003c/td\u003e\u003ctd\u003e事实来源、时间戳、风险解释；不要把建议当成 Customer Promise。\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003ctd\u003eCEC SOP 草稿\u003c/td\u003e\u003ctd\u003e记录上下文、动作、结果；业务 Owner 审核后再发布。\u003c/td\u003e\u003c/tr\u003e\n              \u003ctr\u003e\u003ctd\u003e料件替换建议\u003c/td\u003e\u003ctd\u003e库存、优先级与运输约束；高风险 Action 需人工确认。\u003c/td\u003e\u003c/tr\u003e\n            \u003c/table\u003e\n          \u003c/section\u003e\n\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e后台效率，不等于自动承诺\u003c/h2\u003e\n            \u003cul class=\"checks\"\u003e\n              \u003cli\u003e小模型：高频分类和路由\u003c/li\u003e\n              \u003cli\u003e规则/模板：稳定流程\u003c/li\u003e\n              \u003cli\u003e大模型：复杂理解与解释\u003c/li\u003e\n              \u003cli\u003eOntology：压缩上下文、限定范围\u003c/li\u003e\n              \u003cli\u003e缓存：重复任务复用\u003c/li\u003e\n              \u003cli\u003e人工：异常与风险升级\u003c/li\u003e\n            \u003c/ul\u003e\n            \u003cp class=\"micro\"\u003e以上是建议的分工框架，不代表现有 Runtime 已具备全部能力；Token Saving 需以真实调用与质量口径验证。\u003c/p\u003e\n          \u003c/section\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"callout\"\u003e\n          \u003cspan class=\"badge\"\u003e操作边界\u003c/span\u003e\n          \u003cp\u003e\u003cstrong\u003e本页是概念操作流程，不是产品截图或已上线界面。\u003c/strong\u003e 现场可任选一个业务请求，填入输入、标准、Action 权限、质量检查和反馈Owner，形成可讨论的 Runtime 验收草案。\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cfooter class=\"footer\"\u003e\n        \u003cspan\u003e\u003cstrong\u003e讨论/产出\u003c/strong\u003e 业务人员最常用的四类请求中，哪一类先做标准模板？产出：首批模板字段、Action 权限级别、异常回流人。\u003c/span\u003e\n        \u003cspan\u003e27 / 40\u003c/span\u003e\n      \u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":28,"id":"p28_factory","chapter":4,"ref":"4.2","type":"构建推演与讨论","minutes":15,"title":"4.2 Agent Factory：草案到可治理发布","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}\n.slide-container{\n  width:1280px;\n  height:720px;\n  background:#F7F7F9;\n  color:#4A4A4D;\n  font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;\n  display:flex;\n  fle 3cbody\u003e\n\u003cdiv class=\"slide-container\"\u003e\n  \u003cdiv class=\"frame\"\u003e\n    \u003caside class=\"rail\"\u003e\n      \u003cdiv class=\"brand\"\u003eitem\u003c/div\u003e\n      \u003cdiv class=\"rail-kicker\"\u003eBUSINESS VALUE WORKSHOP\u003c/div\u003e\n      \u003cdiv class=\"chapters\"\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e0\u003c/span\u003e\u003cspan\u003eWhy · 为什么现在\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e1\u003c/span\u003e\u003cspan\u003e总体架构\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e2\u003c/span\u003e\u003cspan\u003e七个案例\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e3\u003c/span\u003e\u003cspan\u003e能力底座\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter active\"\u003e\u003cspan class=\"no\"\u003e4\u003c/span\u003e\u003cspan\u003e业务工具\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e5\u003c/span\u003e\u003cspan\u003eOntology\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e6\u003c/span\u003e\u003cspan\u003e合作计划\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e7\u003c/span\u003e\u003cspan\u003e决策收敛\u003c/span\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\n    \u003c/aside\u003e\n    \u003cmain class=\"main\"\u003e\n      \u003cheader class=\"top\"\u003e\n        \u003cspan class=\"ref\"\u003eMD §4.2\u003c/span\u003e\n        \u003cspan class=\"badge\"\u003e构建推演与讨论 · 建议 15 分钟\u003c/span\u003e\n      \u003c/header\u003e\n      \u003cdiv class=\"heading\"\u003e\n        \u003ch1\u003e4.2 Agent Factory：草案到可治理发布\u003c/h1\u003e\n        \u003cp class=\"lead\"\u003eFactory 把场景经验变成可测试、可回滚、可追溯的 Agent 资产；“能运行”只是起点。\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"two\"\u003e\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e建议的构建链\u003c/h2\u003e\n            \u003cdiv class=\"factory-flow\"\u003e\n              \u003cdiv class=\"factory-row\"\u003e\n                \u003cdiv class=\"number\"\u003e01\u003c/div\u003e\n                \u003ch3\u003e场景草案\u003c/h3\u003e\n                \u003cp\u003e从业务目标、流程断点、输入与输出开始，先写清成功和失败边界。\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"factory-row\"\u003e\n                \u003cdiv class=\"number\"\u003e02\u003c/div\u003e\n                \u003ch3\u003eGroup Agent\u003c/h3\u003e\n                \u003cp\u003e按任务拆分子 Agent；确定谁编排、谁调用、谁在异常时交人。\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"factory-row\"\u003e\n                \u003cdiv class=\"number\"\u003e03\u003c/div\u003e\n                \u003ch3\u003e能力与边界\u003c/h3\u003e\n                \u003cp\u003e接入 Ontology / Data / Model / Skill / MCP / Tools，配置权限、上下文和 Action。\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"factory-row\"\u003e\n                \u003cdiv class=\"number\"\u003e04\u003c/div\u003e\n                \u003ch3\u003e沙盒与发布\u003c/h3\u003e\n                \u003cp\u003eQualification 通过后版本发布；记录调用、Token、错误、人工介入和业务反馈。\u003c/p\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/section\u003e\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e谁在何处负责判断\u003c/h2\u003e\n            \u003cul class=\"roles\"\u003e\n              \u003cli\u003e\u003cstrong\u003eDT\u003c/strong\u003e：业务数字化、流程和数据关系；确认系统接口与流程口径。\u003c/li\u003e\n              \u003cli\u003e\u003cstrong\u003eFDE\u003c/strong\u003e：现场交付与领域知识；补充异常、例外和真实操作边界。\u003c/li\u003e\n              \u003cli\u003e\u003cstrong\u003eSenior User\u003c/strong\u003e：判断结果是否可用；参与规则、输出和接管设计。\u003c/li\u003e\n              \u003cli\u003e\u003cstrong\u003eDeveloper\u003c/strong\u003e：Connector、Tools、部署、日志和工程实现。\u003c/li\u003e\n              \u003cli\u003e\u003cstrong\u003e业务 Owner / IT Security\u003c/strong\u003e：价值指标、权限、安全与生产要求待确认。\u003c/li\u003e\n            \u003c/ul\u003e\n            \u003cp class=\"tagline\"\u003e角色不是固定组织架构；本页用于现场补齐 Owner、输入、产出和决策门。\u003c/p\u003e\n          \u003c/section\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"callout\"\u003e\n          \u003cspan class=\"badge\"\u003e构建原则\u003c/span\u003e\n          \u003cp\u003e\u003cstrong\u003e每一项能力都要留下证据。\u003c/strong\u003e 草案要能回到场景；配置要能解释权限；测试要能重现异常；发布要能定位版本。现有 Agent Factory 是否已覆盖这些环节，需以实际环境逐项核验。\u003c/p\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"section\"\u003e\n          \u003ch2\u003e从“搭出来”转成“可治理资产”\u003c/h2\u003e\n          \u003ctable class=\"table\"\u003e\n            \u003ctr\u003e\u003cth\u003e阶段\u003c/th\u003e\u003cth\u003e必须回答\u003c/th\u003e\u003cth\u003e现场产出\u003c/th\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd\u003e构建\u003c/td\u003e\u003ctd\u003e输入从哪里来？哪个 Ontology 对象承接？\u003c/td\u003e\u003ctd\u003e场景卡、能力目录、Action 清单\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd\u003eQualification\u003c/td\u003e\u003ctd\u003e缺失数据、错误规则、权限越界如何处理？\u003c/td\u003e\u003ctd\u003e测试集、预期输出、失败证据与 Owner\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd\u003e运行\u003c/td\u003e\u003ctd\u003e谁看日志？谁接管？如何回滚？\u003c/td\u003e\u003ctd\u003e版本记录、运行观测、反馈与下一决策门\u003c/td\u003e\u003c/tr\u003e\n          \u003c/table\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cfooter class=\"footer\"\u003e\n        \u003cspan\u003e\u003cstrong\u003e讨论/产出\u003c/strong\u003e 选一个首批业务流程，现场补齐四类 Owner、能力依赖和发布证据。产出：一张 Factory 构建卡，不声称已实现。\u003c/span\u003e\n        \u003cspan\u003e28 / 40\u003c/span\u003e\n      \u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":29,"id":"p29_qualification","chapter":4,"ref":"4.2 Qualification","type":"验收工作页","minutes":10,"title":"4.2 能跑起来，不等于可以上线","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}\nhtml,body{height:100%}\nbody{background:#fff}\n.slide-container{\n  width:1280px;\n  height:720px;\n  background:#F7F7F9;\n  color:#4A4A4D;\n  font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;\n  display:flex;\n  flex-direction:column;\n  overflow:hidden;\n  -webkit-font-smoothing:antialiased;\n  -moz-osx-font-smoothing:grayscale;\n}\n.frame{\n  display:grid;\n  grid-template-columns:240px 1040px;\n  flex:1;\n  height:720px;\n  align-items:stretch;\n}\n.rail{\n  border-right:1px solid #D1D1D6;\n  display:flex;\n  flex-direction:column;\n  padding-top:20px;\n  padding-left:20px;\n  padding-right:18px;\n  gap:12px;\n  min-height:0;\n}\n.brand{font-size:24px;font-weight:800;letter-spacing:-1px;color:#1A1A1A}\n.rail-kicker{font-size:11px;letter-spacing:1.6px;color:#8E8E93}\n.chapters{display:flex;flex-direction:column;gap:12px;padding-top:18px;overflow:hidden}\n.chapter{font-size:15px;display:flex;gap:10px;color:#8E8E93;line-height:1.3}\n.chapter .no{width:20px;font-family:monospace}\n.chapter.active{color:#1A1A1A;font-weight:700}\n.chapter.active .no{color:#8BAEAE}\n.rail-bottom{margin-top:auto;margin-bottom:16px;font-size:12px;line-height:1.6;color:#8E8E93}\n.main{\n  display:flex;\n  flex-direction:column;\n  padding-top:18px;\n  padding-left:34px;\n  padding-right:40px;\n  min-width:0;\n  min-height:0;\n}\n.top{\n  display:flex;\n  justify-content:space-between;\n  align-items:center;\n  border-bottom:1px solid #D1D1D6;\n  min-height:36px;\n  font-size:12px;\n  letter-spacing:.4px;\n  color:#8E8E93;\n  padding-bottom:6px;\n}\n.badge{\n  display:inline-flex;\n  align-items:center;\n  bord r\"\u003e\u003cspan class=\"no\"\u003e7\u003c/span\u003e\u003cspan\u003e决策收敛\u003c/span\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\n    \u003c/aside\u003e\n    \u003cmain class=\"main\"\u003e\n      \u003cheader class=\"top\"\u003e\n        \u003cspan class=\"ref\"\u003eMD §4.2 Qualification\u003c/span\u003e\n        \u003cspan class=\"badge\"\u003e验收工作页 · 建议 10 分钟\u003c/span\u003e\n      \u003c/header\u003e\n\n      \u003cdiv class=\"heading\"\u003e\n        \u003ch1\u003e4.2 能跑起来，不等于可以上线\u003c/h1\u003e\n        \u003cp class=\"lead\"\u003eQualification 把“结果看起来不错”拆成可复现的测试输入、预期输出、证据与责任人。\u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"four\"\u003e\n          \u003csection class=\"gate\"\u003e\n            \u003cdiv class=\"number\"\u003eGATE 01\u003c/div\u003e\n            \u003ch3\u003e业务规则覆盖\u003c/h3\u003e\n            \u003cp\u003e确认场景和关键规则不是只覆盖正常路径。\u003c/p\u003e\n            \u003cul\u003e\n              \u003cli\u003e测试输入：正常、优先级变化、跨组织查询\u003c/li\u003e\n              \u003cli\u003e证据：输出与业务规则逐项对照\u003c/li\u003e\n            \u003c/ul\u003e\n          \u003c/section\u003e\n\n          \u003csection class=\"gate\"\u003e\n            \u003cdiv class=\"number\"\u003eGATE 02\u003c/div\u003e\n            \u003ch3\u003e异常、安全与 Action\u003c/h3\u003e\n            \u003cp\u003e把缺失事实、错误承诺和权限越界放进测试集。\u003c/p\u003e\n            \u003cul\u003e\n              \u003cli\u003e测试输入：缺库存、错误 BO 承诺、越权写入\u003c/li\u003e\n              \u003cli\u003e证据：阻断、升级与人工确认记录\u003c/li\u003e\n            \u003c/ul\u003e\n          \u003c/section\u003e\n\n          \u003csection class=\"gate\"\u003e\n            \u003cdiv class=\"number\"\u003eGATE 03\u003c/div\u003e\n            \u003ch3\u003e响应与成本\u003c/h3\u003e\n            \u003cp\u003e同时观察响应时间、Token、调用和 GPU 口径。\u003c/p\u003e\n            \u003cul\u003e\n              \u003cli\u003e测试输入：高频简单任务、复杂判断任务\u003c/li\u003e\n              \u003cli\u003e证据：路由、调用量与质量对照\u003c/li\u003e\n            \u003c/ul\u003e\n          \u003c/section\u003e\n\n          \u003csection class=\"gate\"\u003e\n            \u003cdiv class=\"number\"\u003eGATE 04\u003c/div\u003e\n            \u003ch3\u003e接管与可追溯\u003c/h3\u003e\n            \u003cp\u003e人能否接手，团队能否复盘，版本能否回滚。\u003c/p\u003e\n            \u003cul\u003e\n              \u003cli\u003e测试输入：中断、异常升级、版本切换\u003c/li\u003e\n              \u003cli\u003e证据：人工介入、日志、版本记录\u003c/li\u003e\n            \u003c/ul\u003e\n          \u003c/section\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"callout\"\u003e\n          \u003cspan class=\"badge\"\u003e九维验收\u003c/span\u003e\n          \u003cp class=\"prompt\"\u003e\u003cstrong\u003e业务场景覆盖、关键规则、异常与数据缺失、权限与安全、Action 风险、响应时间、成本 / Token、人工接管、版本与日志完整性。\u003c/strong\u003e 四道门是组织验收入口；每道门都要补齐 Owner（待确认）、输入、预期输出和证据位置。\u003c/p\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"section\"\u003e\n          \u003ch2\u003e现场填写：不先填“通过”，先填“如何证明”\u003c/h2\u003e\n          \u003ctable class=\"table\"\u003e\n            \u003ctr\u003e\u003cth\u003e样例任务\u003c/th\u003e\u003cth\u003e测试输入\u003c/th\u003e\u003cth\u003e预期行为\u003c/th\u003e\u003cth\u003e证据 / Owner\u003c/th\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd\u003eBO 原因与 ETA\u003c/td\u003e\u003ctd\u003e缺料或物流状态缺失\u003c/td\u003e\u003ctd\u003e标注事实缺口，不生成未经确认的承诺；必要时升级人工。\u003c/td\u003e\u003ctd\u003e日志、来源、接管记录 / 待确认\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd\u003e料件替换建议\u003c/td\u003e\u003ctd\u003e替代料件权限不明\u003c/td\u003e\u003ctd\u003e只给建议或阻断写入，要求业务确认。\u003c/td\u003e\u003ctd\u003eAction 审计 / 待确认\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd\u003eCEC SOP 草稿\u003c/td\u003e\u003ctd\u003e记录与现有 SOP 不一致\u003c/td\u003e\u003ctd\u003e标记缺失，进入 Owner 审核，不直接发布。\u003c/td\u003e\u003ctd\u003e版本、审核、发布记录 / 待确认\u003c/td\u003e\u003c/tr\u003e\n          \u003c/table\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"section\"\u003e\n          \u003ch2\u003e验收门的决策字段\u003c/h2\u003e\n          \u003cp class=\"muted\"\u003eOwner：待确认　|　输入：脱敏真实数据或演示数据（范围待确认）　|　产出：测试集、结果、证据　|　下一门：待确认　|　时间边界：待确认\u003c/p\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cfooter class=\"footer\"\u003e\n        \u003cspan\u003e\u003cstrong\u003e讨论/产出\u003c/strong\u003e 选择一个业务任务现场走四道门。产出：9维验收清单、测试Owner、上线阻断条件与下一决策门。\u003c/span\u003e\n        \u003cspan\u003e29 / 40\u003c/span\u003e\n      \u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":30,"id":"p30_ontology","chapter":5,"ref":"5.1–5.3","type":"章节综述","minutes":5,"title":"5. Ontology Studio：知识挖掘的第一环","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cstyle\u003e\n *{margin:0;padding:0;box-sizing:border-box}\n .slide-container{\n   width:1280px;\n   min-height:720px;\n  background:#F7F7F9;\n  color:#4A4A4D;\n  font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;\n   display:flex;\n   flex-direction:column;\n}\n .frame{\n   display:grid;\n   grid-template-columns:240px 1040px;\n   flex:1;\n   min-height:720px;\n }\n.rail{\n  border-right:1px solid #D1D1D6;\n  display:flex;\n  flex-direction:column;\n  padding-top:18px;\n  padding-left:22px;\n  padding-right:18px;\n  gap:14px;\n}\n.brand{font-size:26px;font-weight:800;letter-spacing:-1px;color:#1A1A1A}\n.rail-kicker{font-size:11px;letter-spacing:2px;color:#8E8E93}\n.chapters{display:flex;flex-direction:column;gap:12px;padding-top:12px}\n.chapter{font-size:15px;display:flex;gap:10px;color:#8E8E93;line-height:1.3}\n.chapter .no{width:22px;font-family:monospace}\n.chapter.active{color:#1A1A1A;font-weight:700}\n.chapter.active .no{color:#8BAEAE}\n.rail-bottom{margin-top:auto;margin-bottom:18px;font-size:12px;line-height:1.6;color:#8E8E93}\n.main{\n  display:flex;\n  flex-direction:col etch;gap:8px}\n.route-step{border-top:2px solid #8BAEAE;padding-top:8px;display:flex;flex-direction:column;gap:6px}\n.route-step:nth-child(3){border-color:#B4ACBE}.route-step:nth-child(5){border-color:#E2D9A5}\n.arrow{font-size:20px;color:#8E8E93;align-self:center;text-align:center}\n.role{border-top:1px solid #D1D1D6;padding-top:10px}\n.role strong{color:#1A1A1A;font-weight:650}\n.output{border-left:3px solid #E2D9A5;padding-left:12px}\n\u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cdiv class=\"slide-container\"\u003e\n  \u003cdiv class=\"frame\"\u003e\n    \u003caside class=\"rail\"\u003e\n      \u003cdiv class=\"brand\"\u003eItem\u003c/div\u003e\n      \u003cdiv class=\"rail-kicker\"\u003eBUSINESS VALUE WORKSHOP\u003c/div\u003e\n      \u003cdiv class=\"chapters\"\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e0\u003c/span\u003e\u003cspan\u003eWhy · 为什么现在\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e1\u003c/span\u003e\u003cspan\u003e总体架构\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e2\u003c/span\u003e\u003cspan\u003e七个案例\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e3\u003c/span\u003e\u003cspan\u003e能力底座\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e4\u003c/span\u003e\u003cspan\u003e业务工具\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter active\"\u003e\u003cspan class=\"no\"\u003e5\u003c/span\u003e\u003cspan\u003eOntology\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e6\u003c/span\u003e\u003cspan\u003e合作计划\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e7\u003c/span\u003e\u003cspan\u003e决策收敛\u003c/span\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\n    \u003c/aside\u003e\n    \u003cmain class=\"main\"\u003e\n      \u003cheader class=\"top\"\u003e\u003cspan class=\"ref\"\u003eMD §5.1–5.3\u003c/span\u003e\u003cspan class=\"badge\"\u003e章节综述 · 建议 5 分钟\u003c/span\u003e\u003c/header\u003e\n      \u003cdiv class=\"heading\"\u003e\n        \u003ch1\u003e5. Ontology Studio：从知识挖掘开始的第一环\u003c/h1\u003e\n        \u003cp class=\"lead\"\u003e先把事实、事理与行动组织成统一业务语义，再让 Data、Model、Agent、Dynamic Form 与 Action 进入同一条可治理链路。\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"route\"\u003e\n          \u003cdiv class=\"route-step\"\u003e\u003cspan class=\"number\"\u003e01\u003c/span\u003e\u003ch3\u003e挖掘事实\u003c/h3\u003e\u003cp\u003e识别业务对象、状态与数据来源。Ontology 让 Data Hub 不止是连接。\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv class=\"arrow\"\u003e→\u003c/div\u003e\n          \u003cdiv class=\"route-step\"\u003e\u003cspan class=\"number\"\u003e02\u003c/span\u003e\u003ch3\u003e定义事理\u003c/h3\u003e\u003cp\u003e表达关系、规则、例外和优先级。Model Hub 不再只是模型集合。\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv class=\"arrow\"\u003e→\u003c/div\u003e\n          \u003cdiv class=\"route-step\"\u003e\u003cspan class=\"number\"\u003e03\u003c/span\u003e\u003ch3\u003e约束行动\u003c/h3\u003e\u003cp\u003e明确可自动执行与须人工确认的 Action，形成版本、测试和反馈闭环。\u003c/p\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"two\"\u003e\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e为什么是第一环\u003c/h2\u003e\n            \u003cp\u003e没有统一语义，Agent 只能依赖个人 Prompt，Dynamic Form 只能生成页面，Action 也难以判断边界。\u003c/p\u003e\n            \u003cp class=\"small\"\u003e本章结论：Ontology 不是名词清单，而是业务知识到可执行流程的共同起点。\u003c/p\u003e\n          \u003c/section\u003e\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e共建不等于单方录入\u003c/h2\u003e\n            \u003cp\u003e业务 Owner 讲目标与例外；DT / Senior User 梳理系统关系；FDE 补充现场规则；Item 负责方法、工具与产品化；IT / Security 确认权限和生产要求。\u003c/p\u003e\n            \u003cp class=\"small\"\u003e角色边界与 Owner 仍需在工作坊现场确认。\u003c/p\u003e\n          \u003c/section\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"callout\"\u003e\u003cspan class=\"badge\"\u003e本章产出\u003c/span\u003e\u003cdiv class=\"output\"\u003e\u003cp\u003e\u003cstrong\u003e一张可讨论的初版业务模型范围：\u003c/strong\u003e对象、关系、规则、Action、数据来源、风险等级、Owner 与版本反馈入口。以 BO / Customer Promise 为工作坊推演主线，不声称已有完整模型。\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cfooter class=\"footer\"\u003e\u003cspan\u003e\u003cstrong\u003e讨论/产出\u003c/strong\u003e 哪个业务对象最需要先统一语义？现场形成“首批 Ontology 范围 + 角色分工 + 下一验证门”。\u003c/span\u003e\u003cspan\u003e30 / 40\u003c/span\u003e\u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":31,"id":"p31_ontology_bo","chapter":5,"ref":"5.3","type":"共建内容页","minutes":10,"title":"5.3 用 BO 的对象、关系、规则和 Action 建模","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}\n.slide-container{width:1280px;min-height:720px;background:#F7F7F9;color:#4A4A4D;font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;display:flex;flex-direction:column}\n.frame{display:grid;grid-template-columns:240px 1040px;flex:1;min-height:720px}\n.rail{border-right:1px solid #D1D1D6;display:flex;flex-direction:column;padding-top:34px;padding-left:28px;padding-right:24px;gap:21px}\n.brand{font-size:29px;font-weight:800;letter-spacing:-1px;color:#1A1A1A}.rail-kicker{font-size:12px;letter-spacing:2px;color:#8E8E93}.chapters{display:flex;flex-direction:column;gap:20px;padding-top:25px}.chapter{font-size:17px;display:flex;gap:12px;color:#8E8E93;line-height:1.4}.chapter .no{width:22px;font-family:monospace}.chapter.active{color:#1A1A1A;font-weight:700}.chapter.active .no{ =\"ref\"\u003eMD §5.3\u003c/span\u003e\u003cspan class=\"badge\"\u003e共建内容页 · 建议 10 分钟\u003c/span\u003e\u003c/header\u003e\n      \u003cdiv class=\"heading\"\u003e\u003ch1\u003e5.3 用 BO 的对象、关系、规则和 Action 建模\u003c/h1\u003e\u003cp class=\"lead\"\u003eBO 的关键不是回答订单状态，而是解释缺料如何影响维修与 Customer Promise，并把下一步行动置于可控边界内。\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"objects\"\u003e\n          \u003cdiv\u003e\u003ch2\u003e对象层\u003c/h2\u003e\u003cp class=\"small\"\u003e工作坊推演范围\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv class=\"object-list\"\u003e\u003cspan\u003eCustomer\u003c/span\u003e\u003cspan\u003eOrder / Back Order\u003c/span\u003e\u003cspan\u003ePart / Substitute Part\u003c/span\u003e\u003cspan\u003eInventory\u003c/span\u003e\u003cspan\u003eRepair\u003c/span\u003e\u003cspan\u003eShipment / ETA\u003c/span\u003e\u003cspan\u003eService Promise\u003c/span\u003e\u003cspan\u003ePriority\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"relation\"\u003e对象不是孤立名词\u003cbr\u003e要说明状态与影响\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"three\"\u003e\n          \u003csection class=\"section\"\u003e\u003ch3\u003e关系与状态\u003c/h3\u003e\u003cp\u003e工作坊推演：缺料关联 Repair，Repair 进度影响 Shipment 与 ETA，ETA 风险进一步影响 Service Promise；每个关系都要有来源与更新时间。\u003c/p\u003e\u003c/section\u003e\n          \u003csection class=\"section rule\"\u003e\u003ch3\u003e规则与例外\u003c/h3\u003e\u003cp\u003e梳理优先级、替换、库存和运输规则。规则冲突、数据缺失、过期状态必须进入例外路径，不能由模型自行补齐。\u003c/p\u003e\u003c/section\u003e\n          \u003csection class=\"section action\"\u003e\u003ch3\u003eAction 边界\u003c/h3\u003e\u003cp\u003e查询、通知、状态同步可讨论为低风险；料件替换、承诺变更等高风险动作须权限、人工确认与日志。\u003c/p\u003e\u003c/section\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"steps\"\u003e\n          \u003cdiv class=\"step\"\u003e\u003cb\u003e01–02 定义\u003c/b\u003e\u003cp\u003e业务目标、客户承诺、对象清单\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv class=\"step\"\u003e\u003cb\u003e03–05 规则\u003c/b\u003e\u003cp\u003e关系、状态、优先级与自动动作\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv class=\"step\"\u003e\u003cb\u003e06–08 接入测试\u003c/b\u003e\u003cp\u003e人工边界、UKM/订单/库存/物流/维修；真实但脱敏数据沙盒\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv class=\"step\"\u003e\u003cb\u003e09–10 反馈发布\u003c/b\u003e\u003cp\u003e错误与缺失回流 Ontology Owner，版本管理后发布\u003c/p\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"small\"\u003e待确认：UKM、订单、库存、物流和维修的接口范围；哪些 Action 可真实执行、哪些只能模拟；Ontology Owner 与正式发布门。\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cfooter class=\"footer\"\u003e\u003cspan\u003e\u003cstrong\u003e讨论/产出\u003c/strong\u003e 哪条关系或规则最可能改变 Customer Promise？产出对象—关系—规则—Action 草案及待确认清单。\u003c/span\u003e\u003cspan\u003e31 / 40\u003c/span\u003e\u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":32,"id":"p32_ontology_workshop","chapter":5,"ref":"5.2–5.3","type":"分组工作页","minutes":20,"title":"5.2–5.3 现场共建一张可执行业务模型","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}\n.slide-container{width:1280px;min-height:720px;background:#F7F7F9;color:#4A4A4D;font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;display:flex;flex-direction:column}\n.frame{display:grid;grid-template-columns:240px 1040px;flex:1;min-height:720px}\n.rail{border-right:1px solid #D1D1D6;display:flex;flex-direction:column;padding-top:34px;padding-left:28px;padding-right:24px;gap:21px}.brand{font-size:29px;font-weight:800;letter-spacing:-1px;color:#1A1A1A}.rail-kicker{font-size:12px;letter-spacing:2px;color:#8E8E93}.chapters{display:flex;flex-direction:column;gap:20px;padding-top:25px}.chapter{font-size:17px;display:flex;gap:12px;color:#8E8E93;line-height:1.4}.chapter .no{width:22px;font-family:monospace}.chapter.active{color:#1A1A1A;font-weight:700}.chapter.active .no{color:#8BAEAE}.rail-bottom{ ct\u003c/div\u003e\n    \u003c/aside\u003e\n    \u003cmain class=\"main\"\u003e\n      \u003cheader class=\"top\"\u003e\u003cspan class=\"ref\"\u003eMD §5.2–5.3\u003c/span\u003e\u003cspan class=\"badge\"\u003e分组工作页 · 建议 20 分钟\u003c/span\u003e\u003c/header\u003e\n      \u003cdiv class=\"heading\"\u003e\u003ch1\u003e5.2–5.3 现场共建一张可执行业务模型\u003c/h1\u003e\u003cp class=\"lead\"\u003e每个首批 Hero Cases 小组只提交一张可审阅的初版范围：先说业务目标，再落到对象、规则、Action 与责任边界。\u003c/p\u003e\u003c/div\u003e\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"agenda\"\u003e\n          \u003cdiv class=\"agenda-item\"\u003e\u003cb\u003e00–05 分钟\u003c/b\u003e\u003ch3\u003e目标与对象\u003c/h3\u003e\u003cp\u003e写清业务目标、客户承诺、关键对象和必须保留的例外。\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv class=\"agenda-item\"\u003e\u003cb\u003e05–10 分钟\u003c/b\u003e\u003ch3\u003e关系与规则\u003c/h3\u003e\u003cp\u003e画出状态变化、影响链、优先级、替换、库存与运输规则。\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv class=\"agenda-item\"\u003e\u003cb\u003e10–15 分钟\u003c/b\u003e\u003ch3\u003eAction 与数据\u003c/h3\u003e\u003cp\u003e区分自动、审批、只读；标出数据来源、更新时间和缺口。\u003c/p\u003e\u003c/div\u003e\n          \u003cdiv class=\"agenda-item\"\u003e\u003cb\u003e15–20 分钟\u003c/b\u003e\u003ch3\u003e版本与发布\u003c/h3\u003e\u003cp\u003e登记缺失、Owner、版本反馈与下一决策门，不虚构已完成模型。\u003c/p\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"fields\"\u003e\n          \u003cdiv class=\"field\"\u003e\u003cstrong\u003e业务 Owner\u003c/strong\u003e\u003cspan\u003e谁解释目标、流程、例外与价值口径？待确认\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"field\"\u003e\u003cstrong\u003eDT / Senior User\u003c/strong\u003e\u003cspan\u003e谁梳理系统、流程和字段关系？待确认\u003c/span\u003e\u003c/div\u003e\n          \u003cdiv class=\"field\"\u003e\u003cstrong\u003eFDE / Item / IT Security\u003c/strong\u003e\u003cspan\u003e现场规则、方法产品化、权限生产边界；待确认\u003c/span\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003ctable class=\"matrix\"\u003e\n          \u003cthead\u003e\u003ctr\u003e\u003cth\u003e小组填报字段\u003c/th\u003e\u003cth\u003e必须写清\u003c/th\u003e\u003cth\u003e未确定时\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n          \u003ctbody\u003e\n            \u003ctr\u003e\u003ctd\u003e对象—关系—规则\u003c/td\u003e\u003ctd\u003e对象定义、状态、影响方向、数据来源与例外\u003c/td\u003e\u003ctd\u003e标“待确认”，记录需要访谈的团队\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd\u003eAction 风险\u003c/td\u003e\u003ctd\u003e只读 / 通知 / 状态同步 / 替换 / 承诺变更\u003c/td\u003e\u003ctd\u003e不把模拟动作写成真实执行\u003c/td\u003e\u003c/tr\u003e\n            \u003ctr\u003e\u003ctd\u003e产出与下一门\u003c/td\u003e\u003ctd\u003e初版范围、Owner、证据、时间边界、发布门\u003c/td\u003e\u003ctd\u003e没有数据就列口径，不写数字或 ROI\u003c/td\u003e\u003c/tr\u003e\n          \u003c/tbody\u003e\n        \u003c/table\u003e\n        \u003cdiv class=\"outcome\"\u003e\u003cp\u003e\u003cstrong\u003e本轮产出：\u003c/strong\u003e一页初版 Ontology 范围 + 缺失项清单 + Action 风险分级 + Owner/输入/产出/下一决策门。该成果用于后续沙盒测试与版本讨论，不代表生产就绪。\u003c/p\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cfooter class=\"footer\"\u003e\u003cspan\u003e\u003cstrong\u003e讨论/产出\u003c/strong\u003e 各组汇报一条最关键关系、一项高风险 Action、一个数据缺口；主持人收敛到下一门与时间边界。\u003c/span\u003e\u003cspan\u003e32 / 40\u003c/span\u003e\u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":33,"id":"p33_roadmap","chapter":6,"ref":"6.1–6.11","type":"章节综述","minutes":5,"title":"6. 合作计划：复用底座，形成联合产品","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}\n.slide-container{width:1280px;min-height:720px;background:#F7F7F9;color:#4A4A4D;font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;display:flex;flex-direction:column}\n.frame{display:grid;grid-template-columns:240px 1040px;flex:1;min-height:720px}\n.rail{border-right:1px solid #D1D1D6;display:flex;flex-direction:column;padding-top:34px;padding-left:28px;padding-right:24px;gap:21px}\n.brand{fo
