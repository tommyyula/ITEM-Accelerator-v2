"no\"\u003e3\u003c/span\u003e\u003cspan\u003e能力底座\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e4\u003c/span\u003e\u003cspan\u003e业务工具\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e5\u003c/span\u003e\u003cspan\u003eOntology\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter active\"\u003e\u003cspan class=\"no\"\u003e6\u003c/span\u003e\u003cspan\u003e合作计划\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e7\u003c/span\u003e\u003cspan\u003e决策收敛\u003c/span\u003e\u003c/div\u003e\n      \u003c/nav\u003e\n      \u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\n    \u003c/aside\u003e\n\n    \u003cmain class=\"main\"\u003e\n      \u003cheader class=\"top\"\u003e\n        \u003cspan class=\"ref\"\u003eMD §6.1\u003c/span\u003e\n        \u003cspan class=\"badge\"\u003e能力对齐讨论 · 建议 15 分钟\u003c/span\u003e\n      \u003c/header\u003e\n\n      \u003cdiv class=\"heading\"\u003e\n        \u003ch1\u003e6.1 Accelerator 提供什么，Item 不重复建设什么\u003c/h1\u003e\n        \u003cp class=\"lead\"\u003e双方不是竞争平台：Accelerator 负责企业级可复用底座与治理，Item 负责业务落地与产品化，ISS Biz Team 负责真实场景验证。\u003c/p\u003e\n      \u003c/div\u003e\n\n      \u003cdiv class=\"content\"\u003e\n        \u003csection class=\"section\"\u003e\n          \u003ch2\u003e五个横向能力域：从接入到服务化\u003c/h2\u003e\n          \u003ctable class=\"table\"\u003e\n            \u003cthead\u003e\n              \u003ctr\u003e\n                \u003cth\u003eAccelerator 能力域\u003c/th\u003e\n                \u003cth\u003e对 Item × ISS AI 合作的支撑\u003c/th\u003e\n                \u003cth\u003e边界表达 / 待确认字段\u003c/th\u003e\n              \u003c/tr\u003e\n            \u003c/thead\u003e\n            \u003ctbody\u003e\n              \u003ctr\u003e\n                \u003ctd\u003e数据分级互联\u003c/td\u003e\n                \u003ctd\u003eLUDP、数仓、数据湖、DaaS、数据血缘与业务语义接入，形成可信上下文。\u003c/td\u003e\n                \u003ctd\u003e数据 Owner、分级标准、接口范围与刷新责任：待确认。\u003c/td\u003e\n              \u003c/tr\u003e\n              \u003ctr\u003e\n                \u003ctd\u003e算力共享\u003c/td\u003e\n                \u003ctd\u003eGPU as a Service、配额队列、MIG / 分时混部，支撑模型与批量任务。\u003c/td\u003e\n                \u003ctd\u003e配额申请、优先级、跨团队使用边界：待确认。\u003c/td\u003e\n              \u003c/tr\u003e\n              \u003ctr\u003e\n                \u003ctd\u003e模型复用\u003c/td\u003e\n                \u003ctd\u003eMaaS 目录、统一模型网关、LoRA、ISS 专域 \u003cspan class=\"pill\"\u003eISS-LRM\u003c/span\u003e，按任务选择模型。\u003c/td\u003e\n                \u003ctd\u003eISS-LRM 能力、部署与数据范围；不在本页承诺质量或价格。\u003c/td\u003e\n              \u003c/tr\u003e\n              \u003ctr\u003e\n                \u003ctd\u003e部署与认证\u003c/td\u003e\n                \u003ctd\u003eK8S、多租户隔离、统一登录、EA / BIA 认证与共享环境。\u003c/td\u003e\n                \u003ctd\u003e沙盒到生产的认证门、日志留存与安全责任：待确认。\u003c/td\u003e\n              \u003c/tr\u003e\n              \u003ctr\u003e\n                \u003ctd\u003e智能体服务化\u003c/td\u003e\n                \u003ctd\u003e沙箱、Runtime 托管、Agent Marketplace、编排与 A2A 互通。\u003c/td\u003e\n                \u003ctd\u003eSkill / Agent 登记、发现、观测和治理接口：待确认。\u003c/td\u003e\n              \u003c/tr\u003e\n            \u003c/tbody\u003e\n          \u003c/table\u003e\n        \u003c/section\u003e\n\n        \u003cdiv class=\"below\"\u003e\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e五横两纵的运营视角\u003c/h2\u003e\n            \u003cdiv class=\"split\"\u003e\n              \u003cdiv\u003e\n                \u003ch3\u003e\u003cspan class=\"pill\"\u003e横向\u003c/span\u003e能力层\u003c/h3\u003e\n                \u003cp\u003e基础设施与模型服务、数据与知识、模型能力、智能体服务、业务交互生态。\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv\u003e\n                \u003ch3\u003e\u003cspan class=\"pill\"\u003e纵向\u003c/span\u003e治理层\u003c/h3\u003e\n                \u003cp\u003e运营治理与运行观测贯穿目录、权限、版本、质量、成本和反馈。\u003c/p\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/section\u003e\n\n          \u003csection class=\"section risk\"\u003e\n            \u003ch2\u003e会议要定的协作边界\u003c/h2\u003e\n            \u003cp\u003eItem：场景、体验、Agent 编排、动态表单、Action、产品化。\u003c/p\u003e\n            \u003cp\u003eAccelerator：数据、算力、模型服务、部署认证、运行治理。\u003c/p\u003e\n            \u003cp\u003e具体支持、接口和责任矩阵仍标“待确认”。\u003c/p\u003e\n          \u003c/section\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n\n      \u003cfooter class=\"footer\"\u003e\n        \u003cspan\u003e\u003cstrong\u003e讨论问题 / 预期产出\u003c/strong\u003e 哪些能力必须由Accelerator统一治理，哪些可按标准接口接入？产出：五域×责任×接口×认证门的边界表。\u003c/span\u003e\n        \u003cspan\u003e34 / 40\u003c/span\u003e\n      \u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":35,"id":"p35_build_train","chapter":6,"ref":"6.2–6.5","type":"联合交付工作页","minutes":15,"title":"6.2–6.5 先理解业务，再共建、训练","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}\n.slide-container{\n  width:1280px;\n  height:720px;\n  background:#F7F7F9;\n  color:#4A4A4D;\n  font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;\n  display:flex;\n  flex-direction:column;\n}\n.frame{\n  display:grid;\n  grid-template-columns:240px 1040px;\n  flex:1;\n  height:100%;\n  min-height:0;\n}\n.rail{\n  border-right:1px solid #D1D1D6;\n  display:flex;\n  flex-direction:column;\n  padding-top:18px;\n  padding-left:18px;\n  padding-right:14px;\n  gap:12px;\n  min-height:0;\n}\n.brand{\n  font-size:24px;\n  font-weight:800;\n  letter-spacing:-1px;\n  color:#1A1A1A;\n  line-height:1;\n}\n.rail-kicker{\n  font-size:11px;\n  letter-spacing:2px;\n  color:#8E8E93;\n}\n.chapters{\n  display:flex;\n  flex-direction:column;\n  gap:12px;\n  padding-top:12px;\n}\n.chapte chapter\"\u003e\u003cspan class=\"no\"\u003e2\u003c/span\u003e\u003cspan\u003e七个案例\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e3\u003c/span\u003e\u003cspan\u003e能力底座\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e4\u003c/span\u003e\u003cspan\u003e业务工具\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e5\u003c/span\u003e\u003cspan\u003eOntology\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter active\"\u003e\u003cspan class=\"no\"\u003e6\u003c/span\u003e\u003cspan\u003e合作计划\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e7\u003c/span\u003e\u003cspan\u003e决策收敛\u003c/span\u003e\u003c/div\u003e\n      \u003c/nav\u003e\n      \u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\n    \u003c/aside\u003e\n    \u003cmain class=\"main\"\u003e\n      \u003cheader class=\"top\"\u003e\n        \u003cspan class=\"ref\"\u003eMD §6.2–6.5\u003c/span\u003e\n        \u003cspan class=\"badge\"\u003e联合交付工作页 · 建议 15 分钟\u003c/span\u003e\n      \u003c/header\u003e\n      \u003cdiv class=\"heading\"\u003e\n        \u003ch1\u003e6.2–6.5 先理解业务，再共建、训练\u003c/h1\u003e\n        \u003cp class=\"lead\"\u003e四阶段把“想做 Agent”变成可检查的输入、产出和决策门；时间、Owner 与成熟度现场确定，不把建议写成既成状态。\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"phase-grid\"\u003e\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e四阶段交付路线\u003c/h2\u003e\n            \u003cdiv class=\"phases\"\u003e\n              \u003cdiv class=\"phase\"\u003e\n                \u003cdiv class=\"num\"\u003e01\u003c/div\u003e\n                \u003cdiv\u003e\n                  \u003ch3\u003e知识挖掘\u003c/h3\u003e\n                  \u003cp\u003e输入：CEC、eSVC、UKM、SSC/GPO、Global Logistics、Field Service访谈与现有资产。\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv\u003e\n                  \u003cp\u003e\u003cem\u003e产出：\u003c/em\u003eBusiness Knowledge Map、Process Breakpoint Map、Hero Cases 优先级、初版 Ontology。\u003c/p\u003e\n                \u003c/div\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"phase\"\u003e\n                \u003cdiv class=\"num\"\u003e02\u003c/div\u003e\n                \u003cdiv\u003e\n                  \u003ch3\u003e能力基座准备\u003c/h3\u003e\n                  \u003cp\u003e输入：数据源、UKM / EKP / EKF、接口、算力、模型、Connector、Tools。\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv\u003e\n                  \u003cp\u003e\u003cem\u003e产出：\u003c/em\u003eCapability Inventory、Catalog、安全与上线要求、POC 环境。\u003c/p\u003e\n                \u003c/div\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"phase\"\u003e\n                \u003cdiv class=\"num\"\u003e03\u003c/div\u003e\n                \u003cdiv\u003e\n                  \u003ch3\u003e典型 Agent 共建\u003c/h3\u003e\n                  \u003cp\u003e输入：优先 Hero Cases，先 BO / Customer Promise，再知识、CEC、WMS 等组合。\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv\u003e\n                  \u003cp\u003e\u003cem\u003e产出：\u003c/em\u003e少量端到端闭环、沙盒证据、风险分级与待补能力。\u003c/p\u003e\n                \u003c/div\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"phase\"\u003e\n                \u003cdiv class=\"num\"\u003e04\u003c/div\u003e\n                \u003cdiv\u003e\n                  \u003ch3\u003eTraining 与普及\u003c/h3\u003e\n                  \u003cp\u003e输入：标准 Agent、Runtime、Factory、Ontology 与反馈机制。\u003c/p\u003e\n                \u003c/div\u003e\n                \u003cdiv\u003e\n                  \u003cp\u003e\u003cem\u003e产出：\u003c/em\u003e业务用户训练；DT / FDE / Senior User 的构建、Qualification、发布训练。\u003c/p\u003e\n                \u003c/div\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/section\u003e\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e每阶段的决策门\u003c/h2\u003e\n            \u003cdiv class=\"gates\"\u003e\n              \u003cdiv class=\"gate\"\u003e\n                \u003ch3\u003e门 1 · 价值与边界\u003c/h3\u003e\n                \u003cp\u003e是否有业务 Owner、可验证问题、数据边界与不做事项？\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"gate\"\u003e\n                \u003ch3\u003e门 2 · 能力可用性\u003c/h3\u003e\n                \u003cp\u003eData / Model / Connector / Tool / Action / 权限是否有责任人？\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"gate\"\u003e\n                \u003ch3\u003e门 3 · 风险与证据\u003c/h3\u003e\n                \u003cp\u003e关键规则、异常、人工接管、日志与脱敏测试能否复盘？\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"gate\"\u003e\n                \u003ch3\u003e门 4 · 采用与复用\u003c/h3\u003e\n                \u003cp\u003e用户训练、反馈入口、版本维护和跨场景复用条件是否成立？\u003c/p\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/section\u003e\n        \u003c/div\u003e\n        \u003csection class=\"section\"\u003e\n          \u003cdiv class=\"fieldline\"\u003e\n            \u003cdiv\u003e\n              \u003cdiv class=\"label\"\u003e现场填写 · Owner\u003c/div\u003e\n              \u003ch3\u003e业务 / 技术 / 产品 / 安全\u003c/h3\u003e\n              \u003cp\u003e每阶段至少一名业务 Owner 与技术 Owner，具体人选待确认。\u003c/p\u003e\n            \u003c/div\u003e\n            \u003cdiv\u003e\n              \u003cdiv class=\"label\"\u003e输入 → 产出\u003c/div\u003e\n              \u003ch3\u003e证据而非口号\u003c/h3\u003e\n              \u003cp\u003e将数据目录、沙盒记录、测试集、训练签到或反馈日志作为证据。\u003c/p\u003e\n            \u003c/div\u003e\n            \u003cdiv\u003e\n              \u003cdiv class=\"label\"\u003e下一决策门\u003c/div\u003e\n              \u003ch3\u003e时间边界待定\u003c/h3\u003e\n              \u003cp\u003e现场记录进入下一阶段的条件、阻塞项与补齐责任。\u003c/p\u003e\n            \u003c/div\u003e c/div\u003e\n        \u003cdiv class=\"chapter\"\u003e\u003cspan class=\"no\"\u003e7\u003c/span\u003e\u003cspan\u003e决策收敛\u003c/span\u003e\u003c/div\u003e\n      \u003c/nav\u003e\n      \u003cdiv class=\"rail-bottom\"\u003eItem × ISS Biz Team × COO AI Team\u003cbr\u003eHero Cases → Joint Product\u003c/div\u003e\n    \u003c/aside\u003e\n    \u003cmain class=\"main\"\u003e\n      \u003cheader class=\"top\"\u003e\n        \u003cspan class=\"ref\"\u003eMD §6.9–6.11 / 7.3\u003c/span\u003e\n        \u003cspan class=\"badge\"\u003e成本与治理工作页 · 建议 15 分钟\u003c/span\u003e\n      \u003c/header\u003e\n      \u003cdiv class=\"heading\"\u003e\n        \u003ch1\u003e6.11 模型路由与成本治理，先列决策再谈价格\u003c/h1\u003e\n        \u003cp class=\"lead\"\u003e成本治理不是先定价，而是先把任务、模型、数据边界、质量证据与计量方式对齐；任何费率与分摊方式均待确认。\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"content\"\u003e\n        \u003cdiv class=\"decision-grid\"\u003e\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e任务到能力的路由候选\u003c/h2\u003e\n            \u003ctable class=\"route-table\"\u003e\n              \u003cthead\u003e\n                \u003ctr\u003e\u003cth\u003e业务任务\u003c/th\u003e\u003cth\u003e候选能力\u003c/th\u003e\u003cth\u003e路由判断与证据\u003c/th\u003e\u003c/tr\u003e\n              \u003c/thead\u003e\n              \u003ctbody\u003e\n                \u003ctr\u003e\n                  \u003ctd\u003e稳定分类、意图与高频路由\u003c/td\u003e\n                  \u003ctd\u003e\u003cspan class=\"mark\"\u003e小模型\u003c/span\u003e\u003cspan class=\"mark\"\u003e规则\u003c/span\u003e\u003c/td\u003e\n                  \u003ctd\u003e优先低成本与可重复性；需验证目标、阈值、人工接管。\u003c/td\u003e\n                \u003c/tr\u003e\n                \u003ctr\u003e\n                  \u003ctd\u003e领域理解、解释与多 Agent 协作\u003c/td\u003e\n                  \u003ctd\u003e\u003cspan class=\"mark\"\u003eISS-LRM\u003c/span\u003e\u003cspan class=\"mark\"\u003e通用 LLM\u003c/span\u003e\u003c/td\u003e\n                  \u003ctd\u003e按能力边界、数据使用范围、上下文与质量指标选择；部署位置待确认。\u003c/td\u003e\n                \u003c/tr\u003e\n                \u003ctr\u003e\n                  \u003ctd\u003eETA、需求、风险等预测\u003c/td\u003e\n                  \u003ctd\u003e\u003cspan class=\"mark\"\u003e预测模型\u003c/span\u003e\u003c/td\u003e\n                  \u003ctd\u003e输出时间窗、风险或置信信息；必须关联事实源、版本和业务 Owner。\u003c/td\u003e\n                \u003c/tr\u003e\n                \u003ctr\u003e\n                  \u003ctd\u003e库存、运输、料件与计划权衡\u003c/td\u003e\n                  \u003ctd\u003e\u003cspan class=\"mark\"\u003e优化模型\u003c/span\u003e\u003c/td\u003e\n                  \u003ctd\u003e在约束条件下求解方案；人工审批边界与执行 Action 待确认。\u003c/td\u003e\n                \u003c/tr\u003e\n              \u003c/tbody\u003e\n            \u003c/table\u003e\n          \u003c/section\u003e\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e先填四个治理字段\u003c/h2\u003e\n            \u003cdiv class=\"fields\"\u003e\n              \u003cdiv class=\"field\"\u003e\n                \u003ch3\u003e能力边界\u003c/h3\u003e\n                \u003cp\u003eISS-LRM、通用 LLM、预测、优化、小模型各自能做什么？待确认。\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"field\"\u003e\n                \u003ch3\u003e数据与部署\u003c/h3\u003e\n                \u003cp\u003e部署位置、数据使用范围、隔离与日志留存要求。待确认。\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"field\"\u003e\n                \u003ch3\u003e计量口径\u003c/h3\u003e\n                \u003cp\u003e调用次数、Token、GPU 时间、实例或业务能力包，候选并列。\u003c/p\u003e\n              \u003c/div\u003e\n              \u003cdiv class=\"field\"\u003e\n                \u003ch3\u003e成本回流\u003c/h3\u003e\n                \u003cp\u003e业务线、区域、模型等级或 Skill 的分摊维度；回流 ISS Dashboard。\u003c/p\u003e\n              \u003c/div\u003e\n            \u003c/div\u003e\n          \u003c/section\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"bottomline\"\u003e\n          \u003csection class=\"section\"\u003e\n            \u003ch2\u003e质量与采用必须一起看\u003c/h2\u003e\n            \u003cp\u003e建议把 Adoption、响应、错误、人工介入、单位业务价值与调用成本放在同一反馈环；不写增长数字，不承诺定价。\u003c/p\u003e\n            \u003cp\u003e可在 Dashboard 观察模型路由变化，但字段、刷新频率与 Owner 仍需确认。\u003c/p\u003e\n          \u003c/section\u003e\n          \u003csection class=\"section caution\"\u003e\n            \u003ch2\u003e会后决策项\u003c/h2\u003e\n            \u003cp\u003eSkill-based JEV Harness 的正式名称、JEV含义与第一阶段边界；ISS Skill-based Model 的目标架构、Skill Owner、目录和治理规则；Hollis Phase I / II 的时间、交付物与决策门。\u003c/p\u003e\n            \u003cp\u003e“编辑部”含义与是否进入 Demo 未确认，不纳入正式案例。\u003c/p\u003e\n          \u003c/section\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n      \u003cfooter class=\"footer\"\u003e\n        \u003cspan\u003e\u003cstrong\u003e讨论问题 / 预期产出\u003c/strong\u003e 用什么单位把模型成本与业务能力连接，而不把价格假设当事实？产出：路由规则、计量候选、质量证据与会后决策 Owner。\u003c/span\u003e\n        \u003cspan\u003e37 / 40\u003c/span\u003e\n      \u003c/footer\u003e\n    \u003c/main\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"n":38,"id":"p38_decisions","chapter":7,"ref":"7.1","type":"章节综述","minutes":5,"title":"7. From Hero Cases to Joint Product","html":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"zh-CN\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003cstyle\u003e\n*{margin:0;padding:0;box-sizing:border-box}\n.slide-container{width:1280px;min-height:720px;background:#F7F7F9;color:#4A4A4D;font-family:\"Noto Sans SC\",\"Microsoft YaHei\",sans-serif;display:flex;flex-direction:column}\n.frame{display:grid;grid-template-columns:240px 1040px;flex:1;min-height:720px}\n.rail{border-right:1px solid #D1D1D6;display:flex;flex-direction:column;padding-top:34px;padding-left:28px;padding-right:24px;gap:21px}\n.brand{font-size:29px;font-weight:800;letter-spacing:-1px;color:#1A1A1A}\n.rail-kicker{font-size:12px;letter-spacing:2px;color:#8E8E93}\n.chapters{display:flex;flex-direction:column;gap:20px;padding-top:25px}\n.chapter{font-size:17px;display:flex;gap:12px;color:#8E8E93;line-height:1.4}\n.chapter .no{width:22px; 矩阵\u003c/td\u003e\u003ctd\u003eSteven 协助收敛；具体责任人和时间待确认\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e能力准备清单\u003c/td\u003e\u003ctd\u003eData、Knowledge、Model、Connector、Tools、Action、权限、安全、部署、日志、评估\u003c/td\u003e\u003ctd\u003e输入：Capability Inventory；产出：Data / Model / Tool Catalog 与验收门\u003c/td\u003e\u003ctd\u003e三方分工待确认；下一门：沙盒与Qualification\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e联合推进方式\u003c/td\u003e\u003ctd\u003e知识挖掘 → Ontology 共建 → Agent 共建 → Training → 产品化\u003c/td\u003e\u003ctd\u003e输入：七阶段计划与清单；产出：决策门、时间边界、反馈机制\u003c/td\u003e\u003ctd\u003eItem × ISS Biz Team × COO AI Team；Owner / 时间待确认\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003csection class=\"flow\"\u003e\u003cdiv class=\"flow-head\"\u003e\u003ch2\u003e共同主线：从阶段特征到持续能力，再到可复制产品\u003c/h2\u003e\u003cspan\u003e每一门都要留下证据与回流\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"flow-row\"\u003e\u003cdiv class=\"flow-step\"\u003e\u003cstrong\u003eWhy / 业务断点\u003c/strong\u003e\u003cspan\u003e散 · 浅 · 贵，先核实\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"flow-step\"\u003e\u003cstrong\u003eOpen → Transform → Engineer\u003c/strong\u003e\u003cspan\u003e探索、场景化、工程化\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"flow-step\"\u003e\u003cstrong\u003eJEV Harness → ISS Skill-based Model\u003c/strong\u003e\u003cspan\u003e名称与边界待确认\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"flow-step\"\u003e\u003cstrong\u003eData / Compute / Model\u003c/strong\u003e\u003cspan\u003eAgent / Skill 复用\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"flow-step\"\u003e\u003cstrong\u003eFactory → Runtime\u003c/strong\u003e\u003cspan\u003e构建、使用、治理\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"flow-step\"\u003e\u003cstrong\u003eDashboard → Marketplace\u003c/strong\u003e\u003cspan\u003e观测、发现、复用\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"flow-step\"\u003e\u003cstrong\u003e反馈 → 标准产品\u003c/strong\u003e\u003cspan\u003e区域复制与商业探索\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"final-note\"\u003e\u003cb\u003e收束语：\u003c/b\u003e我们共同建设的是可解决真实业务问题、可持续治理、可复制和可商业化的垂直智能解决方案；以可持续、可衡量、更平衡为阶段目标，兼顾创新速度、价值、技术深度、成本与风险。合作不是一次产品交付，下一步以清单和决策门推进。\u003c/div\u003e\u003c/div\u003e\u003cfooter class=\"footer\"\u003e\u003cspan\u003e\u003cstrong\u003e讨论 / 产出\u003c/strong\u003e 逐行确认四项字段；若没有 Owner 或时间，标“待确认”，不把它写成承诺。\u003c/span\u003e\u003cspan\u003e40 / 40\u003c/span\u003e\u003c/footer\u003e\u003c/main\u003e\u003c/div\u003e\u003c/div\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"}]}},"videos":{"case-2.1":{"title":"港口拖柜","src":"","poster":""},"case-2.2":{"title":"WMS Dynamic Form","src":"","poster":""},"case-2.3":{"title":"BO / Customer Promise","src":"","poster":""},"case-2.4":{"title":"BNP → Dynamic Form → PEI","src":"","poster":""},"case-2.5":{"title":"Record \u0026 Reply → CEC SOP","src":"","poster":""},"case-2.6":{"title":"eSVC Small Model","src":"","poster":""},"case-2.7":{"title":"CEC + Genesys AI App","src":"","poster":""}},"markdown":"# AI Accelerator 的业务价值实现探讨\n\nItem × ISS Biz Team × COO AI Team\n\n\u003e 面向联想各部门领导的完整阅读资料。会前用十页简版建立共同业务主线，会上用四十页详版展开案例与讨论，会后用本文件查阅完整内容。三份材料均以 Why 为起点，并使用相同的 MD0–MD7 章节号。本文不是已发生会议的纪要；待确认事项不代表已形成的会议决策。\n\n\u003e **对于 ISS Biz Team，AI 是业务发展的必走之路。下一步不仅要扩大探索，还要尽快将当前“散、浅、贵”的阶段特征，转向可持续、可衡量、更平衡的新阶段。合作不是一次产品交付，而是共同建设业务能力。**\n\n---\n\n## 0. Why：为什么现在需要合作——从“散、浅、贵”走向新阶段\n\n### 本节大纲\n\n- 先回答 Why：为什么 AI 是必走之路，为什么现在需要从局部探索转向可持续的业务经营。\n- 将“散、浅、贵”作为理解当前探索阶段的讨论框架；这是 AI 业务发展的必经阶段，不否定已经形成的实践和能力积累。\n- 共同明确“可持续、可衡量、更平衡”的目标，以业务结果、质量、成本与风险共同判断价值。\n- 由 ISS Biz Team、COO AI Team 和 Item 的互补优势组成业务闭环，并确认首批 Hero Cases、Owner、能力准备清单与联合推进方式。\n\n### 0.1 合作主张与三方优势\n\nAI 不是一条可有可无的技术支线，而是 ISS Biz Team 业务发展的必走之路。三方的合作应把业务理解、企业级 AI 能力和面向用户的应用落地连接起来，而不是再增加一个独立平台、一次孤立交付或一批彼此分散的 Agent。\n\n**ISS Biz Team：业务场景 · 行业知识 · 数据洞察 · AI 应用 · Owner 协同 · 价值验证**\n\n- 从真实业务场景和行业知识出发，识别业务断点、客户承诺与一线用户任务。\n- 结合数据洞察和已有 AI 应用实践，判断哪些能力适合复用、哪些业务假设需要验证。\n- 组织业务 Owner 协同，对业务指标、验收证据、采用与价值验证承担实际责任。\n\n**COO AI Team：AI 技术框架 · 企业级技术栈 · 生成式 AI · 预测 / 诊断 / 优化 · 平台能力 · 规模化赋能**\n\n- 提供 AI 技术框架和企业级技术栈，支持生成式 AI 与预测、诊断、优化等能力在业务流程中协同。\n- 提供平台能力与规模化赋能，支撑能力服务化、复用、部署和治理，避免将其局限为单个模型或供应链预测优化接口。\n- 供应链与服务供应链算法仍是重要的具体能力示例，但不是 COO AI Team 全部能力范围。\n\n**Item：业务需求桥接 · 以用户为中心（user-centric）· 可落地应用 · 应用工程 · Agent 编排 · 产品化**\n\n- 将业务需求桥接为可落地的应用，以用户为中心的技术理念贯穿需求理解、交互、流程与反馈。\n- 从一线用户的真实任务出发，把业务本体、数据、AI 能力与 Action 组织成可使用、可验证的业务体验。\n- 以应用工程、Agent 编排和产品化支撑落地与持续演进，不把技术能力展示替代为业务价值。\n\n三方优势描述用于合作对齐，并不代表所有能力已在本项目接入、验证或获得上线批准。具体接口、交付边界、成熟度和 Owner 仍需共同确认。\n\n### 0.2 合作背景与共同目标\n\nISS Biz Team 已有真实场景、行业知识、数据洞察和 AI 应用实践。问题不在于是否继续使用 AI，而在于如何把分散探索转化为组织级、可持续经营的能力。COO AI Team 的企业级 AI 框架、技术栈、生成式 AI、预测 / 诊断 / 优化与平台能力，和 Item 将业务需求桥接成用户中心应用的能力，共同构成跨部门协作的基础。\n\n因此，三方共同目标不是继续增加数量更多、彼此孤立的 Agent，而是从一组高价值 Hero Cases 出发，将 Data、Compute、Model、Agent 和 Skill 连接成端到端业务流程，并通过 ISS Biz Team 的业务验证沉淀为可治理、可复用、可复制的标准能力。\n\n这条主线同时包含三个业务结果，与“散、浅、贵”的痛点相对应：\n\n1. **从分散建设走向能力协同。** 统一业务语义、责任与能力目录，减少跨团队断点和重复建设。\n2. **从局部试验走向真实业务闭环。** 将知识沉淀、预测 / 诊断 / 优化、业务决策、Action 与用户反馈连接起来，而不只停留在问答或单点辅助。\n3. **从投入难以判断走向全生命周期价值经营。** 同时考虑复用、质量、采用、模型算力、集成维护和治理投入；通过能力组合触发创新，不把目标简单等同于削减 Token 或算力费用。\n\n### 0.3 今天要展示和讨论的内容\n\n- **Why：为什么现在要转变。** 从“散、浅、贵”的阶段特征出发，讨论可持续、可衡量、更平衡的业务目标。\n- **How：如何连接业务、知识、模型与行动。** 展示从 Ontology、Data 和 Model 到 Tools、Agent 和 Action 的六层架构与治理边界。\n- **Evidence：用七个案例验证什么。** 分别讨论流程自动化、业务应用生成、复杂决策、知识沉淀、分层路由和产品化，不把 BO / Customer Promise 当作唯一 Hero Cases。\n- **Enablement：如何让业务与专业团队协同。** 讨论 ITEMGPT Runtime、Agent Factory 和 Ontology Studio 的角色分工。\n- **Next：如何形成可执行的联合推进。** 对齐能力底座、知识挖掘、共建、训练、治理、产品化和下一决策门。\n\n### 0.4 会议结束必须获得的四个确认\n\n1. **确定首批 Hero Cases 组合。** 建议将 BO / Customer Promise 作为优先候选，同时评估 CEC SOP、WMS 等场景的组合，明确各案例的业务问题、边界和价值指标。\n2. **确定参与团队和业务 Owner。** 至少覆盖 CEC、eSVC、UKM、SSC / GPO、Global Logistics、Field Service 等相关团队中的实际责任人。\n3. **确定能力准备清单。** 明确数据、知识、模型、Connector、Tools、Action、权限、安全、部署、日志和评估要求。\n4. **确定联合推进方式。** 明确知识挖掘、Ontology 共建、Agent 共建、培训推广、产品化和下一决策门的责任矩阵。\n\n会议不只是要获得“大家认可方向”，而是要让这四个确认可以在会后转化为 Owner、输入、产出和时间边界。\n\n### 0.5 Why now：从探索阶段转向可持续、可衡量、更平衡\n\n对 ISS Biz Team 而言，AI 是必走之路。“散、浅、贵”可以作为理解当前业务 AI 探索阶段的讨论框架：探索和创新已经发生，但组织级复用、流程深度和全周期经济性尚需共同推进。探索是 AI 业务发展的必经阶段，下一步应尽快迈向可持续、可衡量、更平衡。这不是对既有实践的否定，也不是未经测量即可认定的事实结论。各场景的真实问题、基线和优先级需由业务 Owner 验证。\n\n| 阶段特征 | 对应业务痛点 | 转变路径与讨论证据 |\n| --- | --- | --- |\n| **散** | Agent 和能力分散在团队、地区和流程中，业务上下文与责任不连续；相似能力重复建设、难发现、难复用。 | 用统一 Ontology、Data 上下文、能力目录与 Owner 协同串联业务链；核实流程断点、重复建设和复用情况。 |\n| **浅** | 局部问答、单点辅助或试验尚未稳定连接组织知识、复杂决策、Action 与结果反馈。 | 将行业知识、数据洞察、生成式 AI、预测 / 诊断 / 优化和用户任务组成可治理闭环；通过七个案例验证执行、知识沉淀与客户承诺。 |\n| **贵** | 重复建设、模型和算力、集成维护、培训采用及治理等全生命周期投入不易衡量；投入与业务结果缺少共同口径。 | 先定义总成本与价值基线，再考虑复用、模型路由、部署和运维；不只计算 Token，不预设成本降幅或 ROI。 |\n\n**新阶段的三个目标：**\n\n- **可持续。** 能力有明确 Owner、可维护流程、版本与治理机制；知识和工具能沉淀、复用，并随业务反馈持续演进。\n- **可衡量。** 在统一业务口径下同时观察 Customer Promise、质量、流程透明度、采用、复用和全生命周期成本；基线、数据来源和验收证据要明确。\n- **更平衡。** 在业务价值、创新速度、技术深度、投入成本和风险治理之间形成合适的权衡；既不只追求技术展示，也不把创新等同于单纯降费。\n\n合作需要尽快推动这一转变，但“尽快”不代表可以跳过验证、安全和治理。首批 Hero Cases 应同时说明要解决哪类痛点、需要哪些能力、如何证明价值，以及谁对下一决策门负责。\n\n---\n\n## 1. 总体架构：让业务、知识、模型和行动连成一条链\n\n### 本节大纲\n\n1. 业务人员有什么问题？\n2. 系统需要知道什么？\n3. 系统需要如何判断？\n4. 系统可以执行什么？\n5. 谁来构建、谁来审核、谁来使用？\n6. 如何统计效果并持续优化？\n\n业务链路从 CEC、eSVC、UKM、Field Service、SSC / GPO、Global Logistics、RMC / Pass 等业务上下文出发，经由 Ontology、Data、Model、Connector 和 Tools，最后进入 Agent、Business Interface 和 Action。\n\n\n### 1.1 推荐的架构叙述\n\n不要一上来按产品名称讲，而是按业务问题拆解：\n\n1. **业务人员有什么问题？**\n2. **系统需要知道什么？**\n3. **系统需要如何判断？**\n4. **系统可以执行什么？**\n5. **谁来构建、谁来审核、谁来使用？**\n6. **如何统计效果并持续优化？**\n\n### 1.2 六层架构\n\n#### 第一层：Business Context\n\n这里承载 ISS Biz Team 的组织、角色、业务流程和价值指标：\n\n- CEC：客户电话和人工坐席；\n- eSVC：网站、Chatbot、e-ticket、Email；\n- UKM：诊断知识、Service Menu、换件建议；\n- Field Service：现场服务和维修执行；\n- SSC / GPO：服务供应链、Supply Planning、物料；\n- Global Logistics：物流执行和运输节点；\n- RMC / Pass：维修、订单和服务闭环。\n\n#### 第二层：Ontology Studio\n\n把业务场景中的对象、关系、规则和行动定义出来。例如 BO 场景至少需要理解：\n\n- Customer；\n- Order；\n- Back Order；\n- Part；\n- Inventory；\n- Substitute Part；\n- Repair Case；\n- Shipment；\n- ETA；\n- Service Promise；\n- Priority；\n- Action。\n\nOntology 的关键不是列出名词，而是定义这些对象如何相互影响，以及在什么条件下可以执行什么动作。\n\n#### 第三层：Data Hub\n\nData Hub 负责把事实和上下文接入：\n\n- CRM / Order 数据；\n- 维修和 Field Service 数据；\n- 物料、库存和供应链数据；\n- 物流节点、运输状态和 ETA 数据；\n- UKM / EKP / EKF 知识；\n- SOP、PRD、邮件、会议记录和历史案例；\n- 必要时包括代码库、音视频和其他多模态资料。\n\n#### 第四层：Model Hub\n\nModel Hub 负责提供适合业务场景的判断和计算能力。结合 COO AI 团队的供应链 AI 材料，可以将技术分为三类：\n\n**场景建模：**\n\n- 场景聚合建模；\n- 时序数据结构化建模；\n- 基于图网络的物流模型；\n- 用户需求变化的时空模型；\n- 产品或设备生命周期模型；\n- 产能多变量干预模型；\n- 物流网络拓扑模型。\n\n**决策支持：**\n\n- Le-TSFM 等时序预测基础模型；\n- Router-based Hybrid Forecast；\n- 全局性的结构化层级预测；\n- 协同相关性自动分析；\n- 基于信息或置信区间的预测解释；\n- 需求预测、产能预测、销售预测、补货、物流 ETA 和故障诊断。\n\n**优化决策：**\n\n- Le-OPT 优化求解器；\n- 混合强化学习的多目标优化；\n- 多目标量级同构策略算法；\n- 基于重心梯度的 3-D Bin Packing 算法；\n- 知识增强的因果推理；\n- 生产料件预留、APS、多工厂订单分配、备件计划、库存优化、网络路径和装箱优化。\n\n对 ISS Biz Team 工作坊不需要逐项解释算法，而应说明：\n\n\u003e 大模型负责理解、协作和解释；时序模型负责预测；优化算法负责在约束条件下求解；Ontology 和规则负责限定可控范围；Agent 负责把这些能力编排成业务流程。\n\n#### 第五层：Connector 与 Tools\n\n- Connector 连接系统、数据和外部服务；\n- Tools 封装 API、MCP、业务查询和业务 Action；\n- 高风险动作需要权限、人工确认和日志；\n- 低风险、重复性强的动作可以自动执行。\n\n#### 第六层：Agent 与 Business Interface\n\n- Agent Factory：构建、编排、测试、Qualification 和 Logging；\n- ITEMGPT Runtime：业务人员使用、配置和运行；\n- ISS Dashboard：面向人的入口和业务可视化；\n- Marketplace：属于技术能力层，面向 Agent 提供能力发现、复用和治理。\n\n---\n\n---\n\n## 2. 典型案例的推荐讲法\n\n### 本节大纲\n\n每个案例只承担一个主要证明任务：\n\n- 港口拖柜：证明无头 Agent 可以真正跑流程；\n- WMS Dynamic Form：证明业务人员可以快速构建应用；\n- BO / Customer Promise：证明跨组织数据、预测、优化和 Action 可以形成 Hero Cases；\n- BNP → Dynamic Form → PEI：证明从业务建模到复杂业务生态的扩展能力；\n- Record \u0026 Reply → CEC SOP：证明一线经验可以沉淀为组织知识；\n- eSVC Small Model：证明小模型、路由与 Token Saving 的价值；\n- CEC + Genesys AI App：证明内部能力可以走向标准产品与外部商业化。\n\n\n这些案例不应全部用相同的方式介绍。每个案例承担不同的证明任务。\n\n### 2.1 港口拖柜：证明“无头 Agent 可以真正跑流程”\n\n#### 业务故事\n\n港口拖柜流程涉及打单、监控、派车、状态更新、收付款等多个环节。如果每一步都依赖人工，不仅成本高，也容易出现状态不同步和异常处理延迟。\n\n#### Demo 展示\n\n- 主 Agent 接收一个运输任务；\n- 自动拆解为多个子 Agent；\n- 子 Agent 分别处理订单、监控、派车、状态和结算；\n- 状态变化触发后续动作；\n- 异常进入人工确认；\n- 所有过程可追踪、可回放。\n\n#### 这个案例要证明什么\n\n- 多 Agent 协作不是概念，而是可以承担完整流程；\n- Agent 可以在后台运行，不必每一步都由人发起；\n- 通过标准化 Tools 和 Connectors，可以把流程变成机器人化执行；\n- 这与 ISS Biz Team 的服务供应链、Field Service、物流场景具有迁移关系。\n\n可以补充 Units 场景中后台人员从 570 人减少到 320 人的经验，但正式 Demo 中应明确这是历史案例，不要把它直接承诺为ISS 项目结果。\n\n---\n\n### 2.2 WMS 动态表单：证明“业务人员可以快速做应用”\n\n#### 业务故事\n\n仓储业务经常需要临时表单、异常登记、任务确认、状态采集和现场页面。如果每次都等传统开发，业务响应会很慢。\n\n#### Demo 展示\n\n用户可以用自然语言提出需求，例如：\n\n\u003e 我需要一个用于仓库异常处理的动态表单，能够记录订单、料件、位置、异常类型、照片和处理建议，并在确认后更新状态。\n\n系统生成：\n\n- 动态表单；\n- 页面字段；\n- 校验逻辑；\n- 相关业务流程；\n- 后续 Action；\n- 与 WMS 或其他系统的连接。\n\n#### 这个案例要证明什么\n\n- ITEMGPT Runtime 可以服务 Citizen Business User；\n- 业务人员不需要从零写代码；\n- 应用生成不是最终目的，标准化、可复用和可治理才是重点；\n- 表单和页面可以与 Ontology、Tools 和企业系统连接。\n\n---\n\n### 2.3 BO 项目：重点 Hero Cases 之一\n\n这是整场 Demo 最重要的业务案例，建议占总 Demo 时间的 25%–35%。\n\n#### 业务痛点\n\nBO 不是一个孤立的订单状态问题，它会涉及：\n\n- 客户是否得到明确承诺；\n- CEC 是否能回答客户；\n- eSVC 是否能在网站、Chatbot、e-ticket、Email 上提供一致信息；\n- Field Service 是否有维修资源；\n- UKM 是否提供正确诊断和换件建议；\n- GPO 是否有物料和计划；\n- Global Logistics 是否能按节点完成运输；\n- RMC / Pass 是否完成维修和关闭。\n\n#### 推荐 Demo 场景\n\n选择一个存在缺料或延迟风险的订单：\n\n1. CEC 或 eSVC 收到客户询问；\n2. Agent 读取订单、维修、库存、物流和知识信息；\n3. Ontology 将不同系统中的字段转换为统一业务概念；\n4. Model Hub 预测 ETA 或风险；\n5. 优化模型比较料件替换、订单优先级、库存和运输方案；\n6. Agent 用业务语言解释原因和推荐方案；\n7. 对低风险动作自动执行，对高风险动作请求人工确认；\n8. 更新状态并把结果反馈给 CEC、eSVC、Field Service 和客户。\n\n#### BO 不是“聊天机器人”\n\n需要明确强调：\n\n\u003e BO Agent 的价值不在于回答“订单在哪里”，而在于把分散在不同组织和系统中的信息、规则和决策串起来，帮助组织回答“为什么延迟、什么时候可以完成、下一步应该怎么做”。\n\n#### 需要展示的指标\n\n建议显示指标框架，而不是提前承诺数字：\n\n- BO 查询响应时间；\n- 重复来电和重复查询量；\n- 人工跨团队确认次数；\n- ETA / Customer Promise 准确率；\n- Order Close 周期；\n- 料件替换建议采纳率；\n- Action 自动执行率；\n- 客户满意度和 NPS。\n\n#### 必须正面回应的风险\n\nSusan 或相关团队可能关注：\n\n- 加约束后模型是否过于僵硬；\n- 不加约束时准确性和可控性是否不足；\n- 规模化后质量能否保持；\n- BO 项目是否只是在减少人头，而没有真正提升客户体验。\n\n建议回应：\n\n- 不同风险等级采用不同自治级别；\n- 把预测、优化、规则和大模型分工；\n- 高风险 Action 保留人工审批；\n- 通过沙盒、版本、测试集和日志验证质量；\n- 以 Customer Promise、流程透明度和跨团队协作为核心价值，而不是只看减员。\n\n---\n\n### 2.4 BNP → 动态表单 → PEI：证明“从模型到应用再到复杂业务生态”\n\n由于 BNP 和 PEI 是内部项目名称，正式材料中建议保留内部缩写，并在首次出现时由业务负责人补充全称和背景。\n\n#### 推荐叙事\n\n1. 先从 BNP 的业务对象、流程和规则开始；\n2. 通过 Ontology Studio 建立业务模型；\n3. 由 Agent Factory 生成或配置业务能力；\n4. 通过 ITEMGPT Runtime 生成动态表单和业务页面；\n5. 将同一套能力扩展到 PEI 的伙伴、采购或生态流程；\n6. 展示从知识到应用、从单点场景到业务网络的扩展能力。\n\n#### 这个案例要证明什么\n\n- Item 不只是搭一个聊天入口；\n- 业务建模可以直接转化为可运行的表单和流程；\n- 复杂业务可以先拆成可治理的业务对象和 Action；\n- 一个场景的建模成果可以迁移到相关项目。\n\n---\n\n### 2.5 Record \u0026 Reply → CEC SOP：证明“把一线经验变成组织知识”\n\n#### 业务故事\n\nCEC 坐席每天会产生大量对话和处理经验，但如果只留在个人或一次性对话里，组织无法持续复用。\n\n#### 推荐 Demo 展示\n\n- 录入或导入一段客服交互；\n- Record \u0026 Reply 提取问题、上下文、处理动作和结果；\n- 系统识别是否符合现有 SOP；\n- 对缺失或不一致的步骤进行标记；\n- 生成结构化 SOP 草稿或知识更新建议；\n- 由业务 Owner 审核后进入 UKM / Ontology / Skill；\n- 下一次由 CEC Agent 或 Genesys Agent 调用。\n\n#### 这个案例要证明什么\n\n- AI 能把隐性知识转成显性知识；\n- 知识不是一次生成，而是“记录—审核—发布—使用—反馈—优化”的闭环；\n- Record \u0026 Reply 可以与 CEC SOP、UKM 和 Genesys 连接；\n- 这正是 Ontology Studio 的输入来源之一。\n\n---\n\n### 2.6 eSVC 小模型：可作为补充案例，不宜单独抢主线\n\n准备清单中有“eSVC small model 情绪？”的方向。这里建议在正式材料中先确认两个问题：\n\n- 该小模型的目标是情绪识别、意图识别、路由，还是其他能力；\n- 它是在 eSVC 前端做辅助判断，还是作为 CEC / Genesys Agent 的一个能力组件。\n\n如果确认是情绪或意图相关，可以把它放在 eSVC 案例中，作为：\n\n- 轻量模型承担高频、低成本判断；\n- 将请求路由到正确的知识、Agent 或人工队列；\n- 通过模型分层降低 Token 消耗；\n- 避免所有简单任务都调用大模型。\n\n这个案例适合用来引出 Token Saving、垂直小模型和 Model Hub，不建议单独作为主 Hero Cases。\n\n---\n\n### 2.7 CEC + Genesys AI App：证明“从内部能力到商业化”\n\n#### 推荐叙事\n\nCEC 的成熟能力可以被封装成基于 Genesys 的 AI App：\n\n- 连接客户请求、订单、服务、知识和 SOP；\n- 自动检索和解释信息；\n- 生成标准回复；\n- 推荐下一步处理动作；\n- 在权限和审批规则下执行任务；\n- 将过程记录、结果和人工修正反馈回知识体系。\n\n#### Agent 无头化\n\n“无头化”不是取消人，而是让重复性和后台性工作由 Agent 自动运行：\n\n- 坐席需要时调用；\n- 后台自动监控和补充信息；\n- 异常时升级给人；\n- 最终由人和 Agent 共同完成 Customer Promise。\n\n#### 商业化引申\n\n这可以进一步引出：\n\n- CSAS Genesys AI App；\n- Genesys Marketplace；\n- 将 ISS Biz Team 验证过的服务能力包装为标准产品；\n- 从内部项目走向联想服务产品和外部客户。\n\n---\n\n---\n\n## 3. 能力底座：三方协同与企业级 AI 赋能\n\n### 本节大纲\n\n- Data Hub 不是更多数据源，而是统一的业务上下文；\n- Model Hub 不是模型仓库，而是 Hybrid AI 的服务化协同；\n- Connector 与 Tools 让 Agent 从“能理解”走向“能调用、能执行、可审计”；\n- Dashboard 面向人呈现收益，Marketplace 面向 Agent 提供能力发现与复用；\n- 差异化在于业务 Action、垂直知识、预测优化协同和全生命周期治理；\n- 按 Hollis 框架从 Open 走向 Transform、Engineer，并采用阶段性 Agent 治理。\n\n\n### 3.1 不要把 Data Hub 讲成“更多数据源”\n\nData Hub 的价值是形成统一上下文：\n\n- 同一个订单在 CEC、物流、维修和物料团队中有一致的业务定义；\n- 同一个客户承诺能够被多个 Agent 访问和更新；\n- 同一个知识对象能够在 UKM、SOP、Agent 和 Action 中复用。\n\n### 3.2 不要把 Model Hub 讲成“模型仓库”\n\nModel Hub 的价值是让不同类型的模型在同一个业务流程中协同：\n\n- 时序模型负责预测；\n- 优化模型负责权衡约束；\n- 诊断模型负责归因；\n- 小模型负责高频分类和路由；\n- 大模型负责理解、解释和多 Agent 协作；\n- 规则和 Ontology 负责边界和可控性。\n\n### 3.3 Hybrid AI 是三方协同的技术路径\n\nCOO AI Team 的优势包括 AI 技术框架、企业级技术栈、生成式 AI、预测 / 诊断 / 优化、平台能力和规模化赋能。供应链 AI 材料中的具体结构可以作为业务流程里的一个示例：\n\n**数据与知识驱动的场景建模 → 决策支持 → 优化决策**\n\n这一示例不应限制 COO AI Team 的完整能力边界。Hybrid AI 应让生成式 AI、预测、诊断、优化、小模型、规则与 Ontology 按任务分工，而不是把所有问题交给一个 LLM。\n\nISS Biz Team 提供业务场景、行业知识、数据洞察、AI 应用实践、Owner 协同和价值验证，定义真实业务断点与验收证据。\n\nItem 的价值是以用户为中心（user-centric），将业务需求桥接成可落地的应用：\n\n- 从业务用户真实任务出发，设计业务入口与交互；\n- 通过 Ontology、Agent 编排、动态表单和 Tools 接入把能力组织成业务流程；\n- 将 Action、人工审批、结果反馈和治理纳入同一闭环；\n- 在业务验证后推进产品化与持续演进。\n\n因此，三方结合不只是“Item 接一个联想模型”，而是：\n\n\u003e **ISS Biz Team 定义场景并验证价值，COO AI Team 提供企业级 AI 与规模化赋能，Item 用 user-centric 的理念把业务需求桥接成用户可用、可执行、可治理的应用。**\n\n这一路径对应“散、浅、贵”的转变：通过能力协同解决分散，通过决策行动闭环提升深度，通过复用、路由与全周期治理改善价值经营。具体效果仍须以业务验证为准。\n\n---\n\n### 3.4 ISS Biz Team 智能门户：面向人的 Dashboard，面向 Agent 的 Marketplace\n\n这是需要重点讲清楚的概念。\n\n#### Dashboard 面向人\n\nDashboard 应该帮助业务和管理层回答：\n\n- 哪些 Agent 已上线？\n- 哪些团队在使用？\n- 采用率如何？\n- 哪些流程得到改善？\n- 哪些应用带来了 Customer Experience 或效率收益？\n- 哪些能力可以复制到其他区域？\n\n它是组织级 AI 价值的可视化入口。\n\n#### Marketplace 面向 Agent\n\nMarketplace 不应只是“人去找工具的商城”，而应是 Agent 自动发现和复用能力的目录：\n\n- Agent；\n- Skill；\n- MCP Server；\n- Tools；\n- Models；\n- Ontology 和领域能力。\n\nAgent Factory 或 Master Agent 可以根据任务自动找到合适能力，并按权限调用。\n\n#### Dashboard、Marketplace、Factory 与 Runtime 的关系\n\n- Dashboard 让人看到组织发生了什么；\n- Marketplace 让 Agent 找到可以复用什么；\n- Agent Factory 让专业人员建设和治理什么；\n- ITEMGPT Runtime 让业务人员使用和配置什么。\n\n---\n\n---\n\n## 4. 两套 Business Oriented Tools 的详细定位\n\n### 本节大纲\n\n- ITEMGPT Runtime：让 Citizen Business User 用起来、配置起来；\n- Agent Factory：让 DT、FDE、Senior User 和 Developer 建起来、评起来、管起来；\n- 两者共享 Ontology、Data Hub、Model Hub、Connector、Tools 和治理规范；\n- 通过 Skill-based JEV Harness 过渡，再演进到 ISS Skill-based Model。\n\n\n### 4.1 ITEMGPT Runtime：给最终业务用户\n\n#### 目标用户\n\n- Citizen Business User；\n- CEC / eSVC 等一线人员；\n- 仓库和现场业务人员；\n- 需要使用而不是开发 AI 的人员。\n\n#### 核心体验\n\n用户不需要理解 Prompt、MCP 或复杂模型，只需要表达业务目标：\n\n- “帮我生成一个 WMS 异常处理表单”；\n- “帮我查这个 BO 的原因和预计完成时间”；\n- “把这段 CEC 记录整理成 SOP 草稿”；\n- “请按当前库存和订单优先级给出料件替换建议”。\n\n#### Standardization\n\nITEMGPT Runtime 不应鼓励无限制的个人定制，而要通过：\n\n- 标准模板；\n- 标准字段；\n- 标准 Action；\n- 标准业务术语；\n- 标准权限；\n- 标准输出格式；\n- 标准质量检查。\n\n让 Citizen User 的创新能够进入可治理的组织流程。\n\n#### Robotics / 无头化\n\n运行时不仅是聊天入口，还可以把高频任务变成后台自动执行：\n\n- 状态监控；\n- 资料整理；\n- 任务派发；\n- 标准通知；\n- 数据同步；\n- 异常提醒。\n\n#### Token Saving\n\n- 简单分类和路由由小模型完成；\n- 稳定流程使用规则和模板；\n- 只有复杂判断才调用大模型；\n- 领域知识通过 Ontology 和压缩上下文加载；\n- 重复任务使用缓存和可复用 Agent。\n\n---\n\n### 4.2 Agent Factory：给专业共建者和治理者\n\n#### 目标用户\n\n- DT：业务数字化、流程和数据负责人；\n- FDE：负责现场交付和领域知识落地；\n- Senior User：具备业务判断能力和场景经验的高级用户；\n- Developer：负责工具、连接器、部署和工程实现。\n\n#### 核心能力\n\n- 从场景描述生成 Agent 草案；\n- 将多个子 Agent 组合为 Group Agent；\n- 接入 Ontology、Data、Model、Skill、MCP 和 Tools；\n- 配置权限、上下文和 Action；\n- 在沙盒环境测试；\n- 进行标准化 Qualification；\n- 管理版本和发布；\n- 记录内部调用、Token、错误和人工介入；\n- 评估准确率、响应时间、成本和业务收益。\n\n#### Qualification 的建议维度\n\n一个 Agent 不应因为“能跑起来”就直接发布，至少应通过：\n\n- 业务场景覆盖测试；\n- 关键规则测试；\n- 异常和数据缺失测试；\n- 权限和安全测试；\n- Action 风险测试；\n- 响应时间测试；\n- 成本 / Token 测试；\n- 人工接管测试；\n- 版本和日志完整性测试。\n\n---\n\n---\n\n## 5. Ontology Studio：从知识挖掘开始的第一环\n\n### 本节大纲\n\nOntology Studio 是整个闭环的第一环：它把事实、事理和行动组织成统一业务语义，使 Data、Model、Agent、Dynamic Form 和 Action 不再依赖个人 Prompt 或孤立经验。\n\n\n### 5.1 为什么是第一环\n\n如果没有 Ontology：\n\n- Data Hub 只是数据连接；\n- Model Hub 只是模型集合；\n- Agent 只能依赖 Prompt 理解业务；\n- Dynamic Form 只能生成页面，无法理解业务含义；\n- Action 可能缺乏规则和边界。\n\nOntology Studio 的作用是把业务知识、数据和行动组织成统一的业务语义。\n\n### 5.2 共建工作方式\n\n建议采用五类角色共同参与：\n\n- **业务 Owner**：说明目标、流程、例外和价值指标；\n- **DT / Senior User**：梳理数据、流程和系统关系；\n- **FDE**：补充真实现场知识和服务规则；\n- **Item**：负责方法、工具、Agent 化和产品化；\n- **IT / Security**：确认系统、权限和生产要求。\n\n### 5.3 以 BO 为例的 Ontology 共建步骤\n\n1. 描述 BO 的业务目标和客户承诺；\n2. 列出订单、料件、库存、维修、物流、客户和服务对象；\n3. 定义对象关系和状态变化；\n4. 梳理优先级、替换、库存和运输规则；\n5. 定义哪些动作可以自动执行；\n6. 定义哪些动作必须人工确认；\n7. 接入 UKM、订单、库存、物流和维修数据；\n8. 在沙盒中用真实但脱敏的数据测试；\n9. 将 Agent 使用中的错误和缺失反馈给 Ontology Owner；\n10. 经过版本管理后发布到正式运行环境。\n\n---\n\n---\n\n## 6. 合作计划：从知识挖掘走向联合产品\n\n### 本节大纲\n\n六个合作问题在这里收敛：\n\n- 哪些已有 Agent、Model、Skill、Connector 和数据能力可以直接复用？\n- 哪些能力适合标准接口接入，哪些需要进入 Accelerator 的统一治理与服务化环境？\n- 第一阶段是否采用 Skill-based JEV Harness？\n- 目标状态是否演进为 ISS Skill-based Model？\n- ISS-LRM、通用 LLM、预测模型、优化模型与小模型如何路由和计费？\n- 哪些业务场景真正体现“减少低水平重复”和“触发高水平创新”？\n\n随后通过七个阶段把这些问题转成联合交付：知识挖掘、能力基座准备、Agent 共建、Training、优化深耕、产品沉淀、外部推广。\n\n\n### 6.1 与 ISS AI Accelerator 的能力对齐（放在合作计划中讨论）\n\n在 COO AI 团队 Hollis 提出的 Accelerator 理论框架下，ISS AI Accelerator 应被定位为 Item 业务应用之下的企业级赋能与治理底座。双方不应被表述为两个竞争平台，而应明确协作边界：Item 以用户为中心（user-centric），将业务需求桥接为可落地应用，面向业务场景、用户体验、Agent 编排、动态表单和产品化；Accelerator 面向可复用能力、企业数据、异构算力、模型服务、部署认证和运行治理。\n\n| Accelerator 能力域 | 对 Item × ISS Biz Team AI 合作的支撑 | 会议中应如何表达 |\n|---|---|---|\n| 数据分级互联 | LUDP、数仓、数据湖、DaaS、数据血缘、业务语义和知识接入 | 为 Data Hub 提供可信、可治理、可追溯的数据上下文 |\n| 算力共享 | GPU as a Service、配额队列、MIG / 分时混部、资源利用率优化 | 为模型、Agent 和批量任务提供可控的算力服务 |\n| 模型复用 | MaaS 模型目录、统一模型网关、LoRA、ISS 专域 LRM | Model Hub 不重复造模型，根据任务选择小模型、LRM、LLM、预测和优化模型 |\n| 部署与认证 | K8S、多租户隔离、统一登录、EA / BIA 认证、共享环境 | 让 Demo 能够从沙盒走向可认证、可运行的企业环境 |\n| 智能体服务化 | 沙箱、Runtime 托管、Agent Marketplace、编排、A2A 互通 | 让 Skill 和 Agent 可登记、发现、复用、观测和治理 |\n\nMarketplace 在本架构中属于技术能力层，负责 Agent、Skill、Model、Tool、Connector 和 Ontology 能力的登记、发现、复用、评估与治理；Dashboard 则属于业务交互层，面向管理者和业务人员呈现采用率、收益和运行状态。\n\nAccelerator 的五横两纵架构可简化为：基础设施与模型服务、数据与知识、模型能力、智能体服务、业务交互生态五个横向能力层，加上运营治理和运行观测两类纵向能力。\n\n\n### 6.2 阶段一：知识挖掘\n\n目标是先理解业务，而不是马上开发 Agent。\n\n工作内容：\n\n- 访谈 CEC、eSVC、UKM、SSC/GPO、Global Logistics、Field Service 等团队；\n- 识别现有 Agent、SOP、知识库和流程断点；\n- 梳理 BO、CEC SOP、Genesys、WMS、BNP、PEI 等场景；\n- 建立场景价值、复杂度、数据可得性和复用潜力评分。\n\n产出：\n\n- Business Knowledge Map；\n- Process Breakpoint Map；\n- Hero Cases 优先级；\n- 初版 Ontology 范围。\n\n### 6.3 阶段二：能力基座准备\n\n工作内容：\n\n- 数据源和系统接口；\n- UKM / EKP / EKF 知识接入；\n- Data Hub 与数据治理；\n- 共享算力和 GPU 配额；\n- Model Hub、ISS-LRM、通用 LLM、小模型、预测与优化模型；\n- Connector、Tools、Skill 和 Action；\n- 部署、认证、权限、日志、审计和安全边界。\n\n产出：\n\n- Capability Inventory；\n- Data / Model / Connector / Tool Catalog；\n- 安全和上线要求；\n- POC 环境。\n\n### 6.4 阶段三：典型 Agent 共建\n\n建议优先级：\n\n1. BO / Customer Promise Agent；\n2. CEC Record \u0026 Reply / SOP Agent；\n3. Genesys CEC Agent；\n4. WMS Dynamic Form Agent；\n5. 港口拖柜 Headless Agent；\n6. BNP / PEI 业务建模和动态表单 Agent。\n\n先做少量高价值场景，避免一开始扩展到 20–30 个 POC 而没有统一方法。\n\n### 6.5 阶段四：Training 和普及\n\n#### 业务用户训练\n\n- 如何使用 ITEMGPT Runtime；\n- 如何表达业务需求；\n- 如何使用标准 Agent 和动态表单；\n- 如何反馈错误和改进建议；\n- 哪些 Action 需要人工确认。\n\n#### DT / FDE / Senior User 训练\n\n- 如何使用 Ontology Studio；\n- 如何构建和配置 Agent Factory；\n- 如何连接 Data、Model、Skill、MCP 和 Tools；\n- 如何进行 Qualification、沙盒测试和发布；\n- 如何维护业务知识和版本。\n\n### 6.6 阶段五：优化与垂直深耕\n\n重点方向：\n\n- 上下文压缩；\n- Ontology 完善；\n- 领域小模型；\n- Hybrid AI；\n- 预测与优化模型；\n- 多 Agent 协作；\n- 动态沙盒和规模化部署；\n- Token 和调用成本；\n- 准确性、响应时间和人工介入率。\n\n垂直深耕优先考虑：\n\n- 服务供应链；\n- 售后诊断；\n- BO 与 Customer Promise；\n- 库存和料件替换；\n- 物流 ETA；\n- Supply / Demand Planning；\n- Dynamic Sourcing 与 Tariff。\n\n### 6.7 阶段六：沉淀产品\n\n把成功案例从项目形态转成产品形态：\n\n- 标准 Ontology；\n- 标准数据模型；\n- 标准 Agent；\n- 标准动态表单；\n- 标准 Connectors 和 Tools；\n- 标准治理、测试和部署流程；\n- 标准 Dashboard 指标。\n\n建议形成以下产品包：\n\n1. **ISS Service Intelligence Solution**；\n2. **Back Order / Customer Promise Solution**；\n3. **CEC / Genesys AI Solution**；\n4. **Service Supply Chain Decision Solution**；\n5. **WMS / Warehouse Business Tooling Solution**。\n\n### 6.8 阶段七：外部推广\n\n在内部验证后，探索：\n\n- Genesys Marketplace；\n- 联想服务业务和其他区域；\n- 外部供应链和物流客户；\n- Item SaaS 产品化；\n- 联想品牌、场景与 Item 应用能力联合推广。\n\n外部推广前需要先明确：\n\n- 产品和 IP 归属；\n- 数据和模型使用边界；\n- 联合销售和交付方式；\n- 商业收益分配；\n- 版本、售后和运营责任。\n\n---\n\n### 6.9 Item 自有业务价值案例\n\n为了让合作叙事同时具备“联想/ISS Biz Team 业务价值”和“Item 产品价值”两条证据链，建议补充一个 Item 已经验证过的效率或人力价值案例。该案例不应简单表达为“减员”，而应展示：\n\n- 重复性后台工作被自动化；\n- 人工处理量、人工介入时间或单位案件成本下降；\n- 同等团队规模可以支持更多业务量；\n- 人员从事务性操作转向异常处理和高价值决策；\n- 通过标准 Skill、Agent、Connector 和治理机制，将一次性项目能力沉淀为可复制产品。\n\n如果使用历史案例中的人员数量变化或效率数据，正式 Demo 中必须注明数据的业务背景、时间范围和口径，不应直接将历史结果承诺为 ISS Biz Team 项目结果。\n\n### 6.10 “编辑部”事项\n\n会议笔记中出现“编辑部”字样，但目前尚无法判断其具体团队、项目或业务含义。确认全称、业务场景和是否进入 Demo 前，不纳入正式议程。\n\n---\n\n### 6.11 模型路由、成本治理与内部结算议题\n\nAccelerator 材料中出现 ISS 专域 LRM、统一模型网关和模型复用能力。Demo 中不需要立即给出完整技术定价方案，但应把以下问题列为合作设计议题：\n\n- 哪些任务使用通用 LLM，哪些任务使用 ISS-LRM、领域小模型、预测模型或优化模型？\n- ISS-LRM 的能力边界、部署位置、数据使用范围和质量指标是什么？\n- Model Hub 以调用次数、Token、GPU 时间、模型服务实例还是业务能力包进行成本核算？\n- ISS-LRM 与通用 LLM 的定价/内部结算如何设计，是否需要按业务线、区域、模型等级或 Skill 计费？\n- Skill、Agent、Model 和算力的成本是否能够回流到 Dashboard，形成 Adoption、质量和单位业务价值指标？\n\n建议在会议中先使用“模型路由与成本治理”表述，不在信息未确认前承诺具体价格。\n\n---\n\n## 7. 会议结束确认与下一步\n\n### 7.1 推进方向\n\n**From Hero Cases to Joint Product**\n\n#### 短期、中期与长期\n\n**短期：**\n\n- 将 BO / Customer Promise 作为首批 Hero Cases 的优先候选，并同时确认其他案例的组合与顺序；\n- 完成知识挖掘、数据与接口梳理；\n- 共建 Ontology 和首批 Agent。\n\n**中期：**\n\n- 扩展到 CEC SOP、Genesys、WMS、物流和供应链决策；\n- 建立 ITEMGPT Runtime 与 Agent Factory 的使用和治理体系；\n- 形成 ISS Dashboard 与 Marketplace 的组织级入口。\n\n**长期：**\n\n- 沉淀服务供应链和供应链智能化产品；\n- 在联想其他区域和业务线复制；\n- 通过 Genesys Marketplace 等渠道探索外部推广。\n\n#### 结束语\n\n\u003e AI 是 ISS Biz Team 业务发展的必走之路。我们希望把 ISS Biz Team 的业务场景、行业知识与价值验证，COO AI Team 的企业级 AI 与规模化赋能，以及 Item 以用户为中心的需求桥接和应用落地能力，组合成可持续、可衡量、更平衡的业务能力；在验证后再推进复制和商业化。\n\n---\n\n---\n\n### 7.2 正式会议前准备项\n\n以下事项建议在正式 ISS Biz Team Demo 前确认，避免在会议中出现名称或状态不一致：\n\n1. BNP 的准确业务全称和 PEI 的具体范围；\n2. eSVC small model 的准确目标，是情绪、意图、路由还是其他能力；\n3. CSAS Genesys AI App 的当前成熟度和可演示范围；\n4. BO POC 当前已有结果、问题和可公开指标；\n5. UKM / EKP / EKF 当前可提供的接口和知识范围；\n6. 哪些 Action 可以在 Demo 中真实执行，哪些只能模拟；\n7. 港口拖柜和 WMS 案例的数据是否需要脱敏或改用演示数据；\n8. COO AI 团队供应链 AI 技术材料中模型名称和算法名称的最终英文写法；\n9. ISS Biz Team 业务价值工作坊预计时长以及技术人员和业务领导的比例；\n10. 首批 Hero Cases 的业务 Owner、技术 Owner 和后续 POC 决策人。\n\n---\n\n---\n\n### 7.3 会议后共同确认的决策项\n\n以下事项是本次 Accelerator 讨论后需要补齐的决策，不建议在尚未确认前写成对外承诺：\n\n1. “Skill-based JEV Harness” 的正式名称、JEV 含义和第一阶段交付边界；\n2. “ISS Skill-based Model” 的目标架构、Skill Owner、目录和治理规则；\n3. ISS-LRM 的正式名称、能力范围、部署方式以及与通用 LLM 的路由关系；\n4. ISS-LRM、LLM、GPU、Agent 和 Skill 的定价或内部成本分摊方式；\n5. Data Hub、Connector、Tools 中由 DT、COO、ISS Biz Team AI 和 Item 分别负责的具体内容；\n6. Record \u0026 Reply 的“不存视频”要求和 Edge server 的部署、绑定、数据留存边界；\n7. Hollis Phase I \u0026 II 的阶段目标、时间范围、交付物和决策门；\n8. “编辑部”具体指哪个团队或场景，是否进入 Demo；\n9. Item 自有“业务价值/人力效率”案例的可公开数据、口径和历史背景。\n\n---\n\n---\n\n# 结论\n\n三份材料采用一致主线：首先回答 Why，讨论从“散、浅、贵”的探索阶段向可持续、可衡量、更平衡转变；再用六层架构解释 How，用七个案例形成业务验证证据，以 BO / Customer Promise 作为重点候选而非唯一案例；随后明确三方能力协同、工具与 Ontology 共建，最后对齐 Accelerator、模型路由、全生命周期成本与联合产品路线。\n\n其中最重要的主线是：\n\n**Why：从“散、浅、贵”走向可持续、可衡量、更平衡 → 业务价值与知识挖掘 → Open 探索 → Transform 场景化 → Engineer 工程化 → Skill-based JEV Harness → ISS Skill-based Model → Data / Compute / Model / Agent / Skill 复用 → Agent Factory / ITEMGPT Runtime → ISS Dashboard / Marketplace → 反馈优化 → 标准产品与推广**\n\n\n---\n\n---\n\n---\n\n# 附录 A：会前、会上、会后的阅读关系\n\n三份材料使用相同的 MD0–MD7 章节号，一级目录第0章为“Why · 为什么现在”。会前简版用于理解 Why 和业务主线；会上详版用于观看案例与讨论；会后本文用于完整回查。HTML 可切换版本，并保持所选 MD 章节。\n\n## 十页会前简版与四十页详版映射\n- 简版第01页｜MD §0.1–0.2 / 0.5｜Why：AI业务价值与三方互补优势｜对应详版第1页。\n- 简版第02页｜MD §0.2–0.5｜Why now：从散、浅、贵走向新阶段｜对应详版第3–6页。\n- 简版第03页｜MD §1.1–1.2｜从业务知识到可执行行动｜对应详版第7–10页。\n- 简版第04页｜MD §2.1–2.7｜七个案例与 Hero Cases 组合｜对应详版第11–21页。\n- 简版第05页｜MD §3.1–3.4｜统一上下文与能力复用｜对应详版第22–25页。\n- 简版第06页｜MD §4.1–4.2｜两套业务工具与角色分工｜对应详版第26–29页。\n- 简版第07页｜MD §5.1–5.3｜Ontology Studio 与知识共建｜对应详版第30–32页。\n- 简版第08页｜MD §6.1–6.11｜从能力共建走向联合产品｜对应详版第33–37页。\n- 简版第09页｜MD §7.1–7.3｜从 Hero Cases 到联合产品｜对应详版第38–40页。\n- 简版第10页｜MD §0–7 / 结论｜会前、会上、会后三份材料联动｜对应详版第1–40页。\n\n## 四十页详版内容索引\n- 详版第01页｜MD §0.1–0.2 / 0.5｜Why：AI业务价值与三方互补优势。\n- 详版第02页｜MD §0.3–0.4 / 0.5｜Why：从部门场景走向可持续业务能力。\n- 详版第03页｜MD §0.1–0.5｜合作不是一次产品交付，而是建设持续业务能力。\n- 详版第04页｜MD §0.1–0.2｜三方优势：业务验证、企业级AI与用户中心应用。\n- 详版第05页｜MD §0.2 / 0.5｜Why now：从散、浅、贵走向新阶段。\n- 详版第06页｜MD §0.4｜0.4 今天必须获得的四类确认。\n- 详版第07页｜MD §1.1–1.2｜1. 让业务、知识、模型和行动连成一条链。\n- 详版第08页｜MD §1.2 第二–三层｜1.2 从系统字段到统一业务上下文。\n- 详版第09页｜MD §1.2 第四层｜1.2 判断能力必须分工。\n- 详版第10页｜MD §1.2 第五–六层｜1.2 从能理解到能执行、可审计。\n- 详版第11页｜MD §2.1–2.7｜2. 七个案例，各证明一件事。\n- 详版第12页｜MD §2.1｜2.1 港口拖柜：无头 Agent 跑完整流程。\n- 详版第13页｜MD §2.2｜2.2 WMS Dynamic Form：业务人员快速做应用。\n- 详版第14页｜MD §2.3｜2.3 BO / Customer Promise：重点 Hero Cases 之一。\n- 详版第15页｜MD §2.3 推荐 Demo 场景｜2.3 把 BO 的八步闭环逐步走通。\n- 详版第16页｜MD §2.3 指标与风险｜2.3 指标不是承诺；治理不是把模型锁死。\n- 详版第17页｜MD §2.4｜2.4 BNP → Dynamic Form → PEI。\n- 详版第18页｜MD §2.5｜2.5 Record \u0026 Reply → CEC SOP。\n- 详版第19页｜MD §2.6｜2.6 eSVC Small Model：高频判断与成本分层。\n- 详版第20页｜MD §2.7｜2.7 CEC + Genesys AI App：内部能力走向产品。\n- 详版第21页｜MD §2 / 6.4｜2. 为首批 Hero Cases 做组合选择。\n- 详版第22页｜MD §3.1–3.4｜3. 能力底座：不堆数据，不堆模型。\n- 详版第23页｜MD §3.1–3.3｜三方Hybrid AI：从企业级能力到用户业务闭环。\n- 详版第24页｜MD §3.4｜3.4 面向人的 Dashboard；面向 Agent 的 Marketplace。\n- 详版第25页｜MD §3 本节大纲 / 6.1 / 7.3｜3. 从 Open 到 Transform，再到 Engineer。\n- 详版第26页｜MD §4.1–4.2｜4. 两套 Business Oriented Tools，共用同一底座。\n- 详版第27页｜MD §4.1｜4.1 ITEMGPT Runtime：目标表达、标准化、后台执行。\n- 详版第28页｜MD §4.2｜4.2 Agent Factory：草案到可治理发布。\n- 详版第29页｜MD §4.2 Qualification｜4.2 能跑起来，不等于可以上线。\n- 详版第30页｜MD §5.1–5.3｜5. Ontology Studio：知识挖掘的第一环。\n- 详版第31页｜MD §5.3｜5.3 用 BO 的对象、关系、规则和 Action 建模。\n- 详版第32页｜MD §5.2–5.3｜5.2–5.3 现场共建一张可执行业务模型。\n- 详版第33页｜MD §6.1–6.11｜6. 合作计划：复用底座，形成联合产品。\n- 详版第34页｜MD §6.1｜6.1 Accelerator 提供什么，Item 不重复建设什么。\n- 详版第35页｜MD §6.2–6.5｜6.2–6.5 先理解业务，再共建、训练。\n- 详版第36页｜MD §6.6–6.8 / 6.9｜6.6–6.8 深耕、沉淀产品，再探索外部推广。\n- 详版第37页｜MD §6.9–6.11 / 7.3｜6.11 模型路由与成本治理，先列决策再谈价格。\n- 详版第38页｜MD §7.1｜7. From Hero Cases to Joint Product。\n- 详版第39页｜MD §7.2–7.3｜7.2–7.3 准备项与待决策项不能混为承诺。\n- 详版第40页｜MD §7.1 / 结论｜从Hero Cases走向可持续、可衡量、更平衡。\n\n# 附录 B：会议决定的补录原则\n\n待会议结束后，按实际共同确认的内容记录首批 Hero Cases 范围、业务 Owner、技术 Owner、能力准备清单、责任、输入、产出、时间边界和下一决策门。当前未替参会者填写未知结论；未确认事项继续标“待确认”。\n\n# 附录 C：Demo 视频资料\n\n七个案例分别在详版第12、13、14、17、18、19、20页预留视频。当前视频未提供；不把待接入素材、模拟 Action 或历史案例包装成已完成验证的结果。\n"}</script>
<script>
'use strict';
(function(){
 const data=JSON.parse(document.getElementById('deck-data').textContent);
 const viewer=document.getElementById('viewer'),rail=document.getElementById('viewer-rail');
 const pageSelect=document.getElementById('page-select'),chapterSelect=document.getElementById('chapter-select');
 const previous=document.getElementById('previous'),next=document.getElementById('next');
 const summaryButton=document.getElementById('view-summary'),detailButton=document.getElementById('view-detail');
 const railButtons=Array.from(document.querySelectorAll('#rail-chapters [data-chapter]'));
 const modes=data.decks;
 const defaultMode='summary';
 let mode=defaultMode,pages=[],sheets=[],frames=[],chapterFirst=[],active=0,scale=1,compact=false,indexOpen=true,scheduled=false;
 const pad=n=>String(n).padStart(2,'0');
 data.chapters.forEach((name,chapter)=>{const option=document.createElement('option');option.value=chapter;option.textContent=chapter+' · '+name;chapterSelect.appendChild(option)});
 railButtons.forEach(button=>button.addEventListener('click',()=>goTo(chapterFirst[Number(button.dataset.chapter)])));
 function currentChapter(){return pages[active]?pages[active].chapter:0}
 function updateHash(){try{history.replaceState(null,'','#'+mode+'-p-'+(active+1))}catch(e){}}
 function setActive(index,hash){
  active=Math.max(0,Math.min(pages.length-1,index));const page=pages[active];if(!page)return;
  pageSelect.value=String(active);chapterSelect.value=String(page.chapter);previous.disabled=active===0;next.disabled=active===pages.length-1;
  railButtons.forEach(button=>button.setAttribute('aria-current',String(Number(button.dataset.chapter)===page.chapter)));
  document.getElementById('rail-counter').textContent=(mode==='summary'?'会前简版':'会上详版')+' '+pad(active+1)+' / '+pages.length+'\nMD §'+page.ref;
  document.getElementById('go-related').textContent=mode==='summary'?'查看同章详版 →':'返回同章简版 →';
  document.title=(mode==='summary'?'会前简版':'会上详版')+' · '+pad(active+1)+' / '+pages.length+' · '+page.title;
  if(hash)updateHash();
 }
 function goTo(index){
  if(!sheets.length)return;const i=Math.max(0,Math.min(pages.length-1,Number(index)||0));setActive(i,true);
  const toolbarHeight=document.querySelector('.toolbar').getBoundingClientRect().height;
  window.scrollTo({top:Math.max(0,window.scrollY+sheets[i].getBoundingClientRect().top-toolbarHeight-14),behavior:'auto'});
 }
 function safeUrl(raw){if(!raw)return null;try{const url=new URL(raw,location.href);return ['http:','https:','file:','blob:','data:'].includes(url.protocol)?url.href:null}catch(e){return null}}
 function attachVideos(doc){
  doc.querySelectorAll('[data-video-slot]').forEach(slot=>{const config=data.videos[slot.dataset.videoSlot];if(!config||!config.src)return;const url=safeUrl(config.src);if(!url)return;const video=doc.createElement('video');video.controls=true;video.preload='metadata';video.playsInline=true;video.src=url;video.style.cssText='width:100%;height:100%;object-fit:contain;background:#1a1a1a;display:block';if(config.poster){const poster=safeUrl(config.poster);if(poster)video.poster=poster}video.setAttribute('aria-label',config.title||'Demo 视频');slot.replaceChildren(video);slot.style.gap='0'});
 }
 function styleFrame(frame){

   style.textContent=compact?'.rail{display:none!important}.frame{grid-template-columns:0px 1040px!important}.main{grid-column:2!important}.slide-container{width:1040px!important}':'.rail{visibility:hidden!important}';
  }catch(e){}
 }
 function render(newMode){
  mode=newMode;pages=modes[mode].pages;active=0;viewer.replaceChildren();pageSelect.replaceChildren();sheets=[];frames=[];
  chapterFirst=data.chapters.map((_,chapter)=>Math.max(0,pages.findIndex(page=>page.chapter===chapter)));
  summaryButton.setAttribute('aria-pressed',String(mode==='summary'));detailButton.setAttribute('aria-pressed',String(mode==='detail'));
  viewer.setAttribute('aria-label',mode==='summary'?'会前简版 · 10页':'会上详版 · 40页');
  pages.forEach((page,index)=>{
   const option=document.createElement('option');option.value=index;option.textContent=pad(index+1)+' / '+pages.length+' · '+page.title;pageSelect.appendChild(option);
   const sheet=document.createElement('section');sheet.className='sheet';sheet.id=mode+'-p-'+(index+1);sheet.setAttribute('aria-label','MD §'+page.ref+' · '+page.title);
   const frame=document.createElement('iframe');frame.className='slide-frame';frame.title=page.title+'（MD §'+page.ref+'）';frame.loading=index<3?'eager':'lazy';
   frame.addEventListener('load',()=>{styleFrame(frame);try{const doc=frame.contentDocument;attachVideos(doc);doc.addEventListener('keydown',handleKeys)}catch(e){}});
   frame.srcdoc=page.html;sheet.appendChild(frame);viewer.appendChild(sheet);sheets.push(sheet);frames.push(frame);
  });
  document.getElementById('bottom').textContent=mode==='summary'?'会前简版面向联想各部门领导，帮助快速理解业务价值、协同边界与需共同确认的事项。点击“查看同章详版”，可进入同一 MD 章节的案例和讨论。会后 MD 保留完整内容，待确认事项不代表已形成会议决议。':'会上详版保留40页完整内容和七个Demo视频接入区。点击“返回同章简版”回到该章总览；“会后MD”可下载完整论证与待确认事项。视频当前仍为待接入素材。';
  sizeAll();setActive(0,false);
 }
 function switchView(newMode){if(newMode===mode)return;const chapter=currentChapter();render(newMode);goTo(chapterFirst[chapter])}
 function sizeAll(){
  const width=window.innerWidth,narrow=width<760;compact=narrow||!indexOpen;
  let mobileRail=0;if(narrow&&indexOpen)mobileRail=Math.min(150,Math.max(112,Math.round(width*.3)));
  viewer.style.marginLeft=mobileRail+'px';viewer.style.width='calc(100% - '+mobileRail+'px)';
  const available=Math.min(width-mobileRail,1280),base=compact?1040:1280;scale=available/base;
  sheets.forEach(sheet=>{sheet.style.width=available+'px';sheet.style.height=(720*scale)+'px'});
  frames.forEach(frame=>{frame.style.width=base+'px';frame.style.height='720px';frame.style.transform='scale('+scale+')';styleFrame(frame)});
  rail.style.left=(narrow?0:Math.max(0,(width-1280)/2))+'px';rail.style.width=(narrow?mobileRail:240*scale)+'px';
  const toolbarHeight=document.querySelector('.toolbar').getBoundingClientRect().height;rail.style.top=(toolbarHeight+14)+'px';
  viewer.style.paddingBottom=Math.max(0,window.innerHeight-toolbarHeight-720*scale)+'px';
  sheets.forEach(sheet=>sheet.style.scrollMarginTop=(toolbarHeight+14)+'px');
 }
 function detectActive(){
  scheduled=false;const top=document.querySelector('.toolbar').getBoundingClientRect().bottom+18;let closest=active,score=Infinity;
  sheets.forEach((sheet,i)=>{const r=sheet.getBoundingClientRect(),distance=Math.abs(r.top-top);if(r.bottom>top&&distance<score){closest=i;score=distance}});
  if(closest!==active)setActive(closest,true);
 }
 function handleKeys(event){
  if(event.ctrlKey||event.metaKey||event.altKey||event.defaultPrevented)return;
  const target=event.target;if(target&&target.closest&&target.closest('input,textarea,select,[contenteditable="true"],video'))return;
  if(event.key===' '&&target&&target.closest&&target.closest('button,a'))return;
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(event.key)){event.preventDefault();goTo(active+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(event.key)){event.preventDefault();goTo(active-1)}
  else if(event.key==='Home'){event.preventDefault();goTo(0)}else if(event.key==='End'){event.preventDefault();goTo(pages.length-1)}
  else if(event.key==='f'||event.key==='F'){event.preventDefault();toggleFullscreen()}
 }
 function toggleFullscreen(){if(!document.fullscreenEnabled){document.getElementById('fullscreen').textContent='浏览器不支持全屏';return}const action=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(action&&action.catch)action.catch(()=>{document.getElementById('fullscreen').textContent='请使用浏览器全屏'})}
 function downloadMarkdown(){const url=URL.createObjectURL(new Blob([data.markdown],{type:'text/markdown;charset=utf-8'}));const anchor=document.createElement('a');anchor.href=url;anchor.download='AI_Accelerator_会后完整阅读资料.md';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
 document.getElementById('download-md').addEventListener('click',downloadMarkdown);document.getElementById('rail-md').addEventListener('click',downloadMarkdown);
 summaryButton.addEventListener('click',()=>switchView('summary'));detailButton.addEventListener('click',()=>switchView('detail'));document.getElementById('go-related').addEventListener('click',()=>switchView(mode==='summary'?'detail':'summary'));
 document.getElementById('toggle-index').addEventListener('click',()=>{indexOpen=!indexOpen;document.documentElement.classList.toggle('index-hidden',!indexOpen);document.getElementById('toggle-index').setAttribute('aria-expanded',String(indexOpen));document.getElementById('toggle-index').textContent=indexOpen?'收起目录':'展开目录';sizeAll();goTo(active)});
 previous.addEventListener('click',()=>goTo(active-1));next.addEventListener('click',()=>goTo(active+1));pageSelect.addEventListener('change',()=>goTo(Number(pageSelect.value)));chapterSelect.addEventListener('change',()=>goTo(chapterFirst[Number(chapterSelect.value)]));
 document.getElementById('fullscreen').addEventListener('click',toggleFullscreen);document.addEventListener('fullscreenchange',()=>{document.getElementById('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏';sizeAll()});document.addEventListener('keydown',handleKeys);
 window.addEventListener('scroll',()=>{if(!scheduled){scheduled=true;requestAnimationFrame(detectActive)}},{passive:true});window.addEventListener('resize',sizeAll);
 function readRoute(){
  const named=location.hash.match(/^#(summary|detail)-p-(\d+)$/);if(named){if(named[1]!==mode)render(named[1]);goTo(Number(named[2])-1);return}
  const chapter=location.hash.match(/^#(?:chapter|md)-(\d)$/);if(chapter){goTo(chapterFirst[Number(chapter[1])]);return}
  const page=location.hash.match(/^#p-(\d+)$/);if(page)goTo(Number(page[1])-1);
 }
 const viewParam=new URLSearchParams(location.search).get('view');if(viewParam==='summary'||viewParam==='detail')mode=viewParam;
 render(mode);if(location.hash)requestAnimationFrame(readRoute);
 window.addEventListener('hashchange',readRoute);
 window.deckViewer={goTo,index:()=>active,pageCount:()=>pages.length,mode:()=>mode,chapter:currentChapter,switchView,downloadMarkdown};
})();
</script>
</body>
